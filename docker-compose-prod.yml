# geniusai-server (Rust backend) using the published GHCR image (same backend as a GitHub release).
#
# Default: :latest (multi-arch; CI publishes it on each release tag — see publish-docker-manifest).
# Override in .env, e.g. LRGENIUS_IMAGE=ghcr.io/lrgenius/lrgeniusai:v1.2.3-x64
#
# Model files aren't fetched at runtime yet — populate ./models yourself, see
# server-rs/scripts/export_siglip2_fp16.py.
#
# GENIUSAI_FACES_CLUSTER_* / GENIUSAI_BACKUP_* from the Python backend are
# intentionally omitted: the Rust backend has no periodic scheduler for
# face clustering or backups yet, so those env vars would currently be
# silently ignored.
#
# Stop:  docker compose down
# Logs:  docker compose logs -f geniusai-server

services:
  geniusai-server:
    image: ${LRGENIUS_IMAGE:-ghcr.io/lrgenius/lrgeniusai:latest}
    container_name: geniusai-server
    restart: unless-stopped
    ports:
      - "19819:19819"
    volumes:
      - ./data:/data
      - ./models:/models
      - ./gcloud:/root/.config/gcloud
    environment:
      - GENIUSAI_HOST=0.0.0.0
      - GENIUSAI_PORT=19819
