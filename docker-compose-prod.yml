# geniusai-server (Rust backend) using the published GHCR image (same backend as a GitHub release).
#
# Default: :latest (multi-arch, amd64 + arm64; CI publishes it on each release
# tag — see publish-docker-manifest). Override in .env, e.g.
#   LRGENIUS_IMAGE=ghcr.io/lrgenius/lrgeniusai:v1.2.3          (pin a release)
#   LRGENIUS_IMAGE=ghcr.io/lrgenius/lrgeniusai:latest-vulkan   (local AI model, any GPU)
#   LRGENIUS_IMAGE=ghcr.io/lrgenius/lrgeniusai:latest-cuda     (local AI model, NVIDIA, amd64 only)
# The default image has no local AI model built in; the -vulkan and -cuda ones
# run one in the backend (llama.cpp), on the GPU when you hand the container
# one below, otherwise on the CPU. Models downloaded from the plug-in's
# settings are kept in ./models/llm.
#
# Model files aren't fetched at runtime yet — populate ./models yourself, see
# server-rs/scripts/export_siglip2_fp16.py.
#
# GENIUSAI_FACES_CLUSTER_* / GENIUSAI_BACKUP_* from the Python backend are
# intentionally omitted: the Rust backend has no periodic scheduler for
# face clustering or backups yet, so those env vars would currently be
# silently ignored.
#
# Stop:  docker compose down
# Token: docker exec geniusai-server /app/geniusai-server token
#        (paste it in Lightroom: Plug-in Manager > LrGeniusAI > Backend Server >
#        Access token; kept in ./data/LrGeniusAI/api-token)
# Logs:  docker compose logs -f geniusai-server
#        (the line "llama: using ... via Vulkan/CUDA" says which GPU a local
#        model runs on; "running on CPU" means the container sees none)

services:
  geniusai-server:
    image: ${LRGENIUS_IMAGE:-ghcr.io/lrgenius/lrgeniusai:latest}
    container_name: geniusai-server
    restart: unless-stopped
    ports:
      - "19819:19819"
    volumes:
      - ./data:/data
      - ./models:/models
    environment:
      - GENIUSAI_HOST=0.0.0.0
      - GENIUSAI_PORT=19819
    # -vulkan image, AMD or Intel GPU:
    # devices:
    #   - /dev/dri:/dev/dri
    # -cuda or -vulkan image, NVIDIA GPU (needs the NVIDIA Container Toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
