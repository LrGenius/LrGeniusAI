sources = [
  "plugin/LrGeniusAI.lrdevplugin/Info.lua",
  "plugin/LrGeniusAI.lrdevplugin/Init.lua",
  "plugin/LrGeniusAI.lrdevplugin/Task*.lua",
]

[page."Dev-Project-README.md"]
