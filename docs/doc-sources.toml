# Which source files each wiki page describes.
#
# `scripts/check-docs.py` compares the last commit that touched a page against
# the last commit that touched its sources, and warns when the sources moved on
# without the page. It is a heuristic — a rename or a formatting pass will trip
# it — so it only warns. Two ways to clear a warning:
#
#   * update the page, or
#   * put `Docs-Reviewed: <Page-Name>.md` in the commit message when the page
#     is still correct as written.
#
# Keep `sources` narrow. A glob that matches half the repo makes every page
# permanently stale, and a warning nobody can clear is a warning nobody reads.
#
# Pages with no entry here are not tracked: Credits, the culling design notes,
# and the other point-in-time documents describe a decision, not a moving
# implementation.


# Endpoints the plugin calls that the backend does not serve go here, under
# `[[contract.known_gap]]` with `endpoint` and a `reason`. Each one is a broken
# feature, not a false positive — the entry exists so the check stays usable
# while the gap is open, and so the gap has a written owner instead of living in
# someone's head. Deleting an entry must mean the gap is closed. There are none
# at the moment.


# Credits has no single source file — it tracks *what the project depends on*.
# So it is keyed to the files that change when a dependency, a model family or a
# downloadable asset is added or removed. That is the same staleness mechanism
# every other page uses, rather than a bespoke checker that would have to guess
# which of several hundred transitive crates deserve a mention.
[page."Credits.md"]
sources = [
  "server-rs/Cargo.toml",
  "server-rs/crates/*/Cargo.toml",
  # New model families show up here first: a `resolve_*` for the paths, and a
  # route module for the download.
  "server-rs/crates/lrg-ml/src/model_paths.rs",
  "server-rs/crates/lrg-api/src/routes/clip.rs",
  "server-rs/crates/lrg-api/src/routes/bioclip.rs",
  "server-rs/crates/lrg-api/src/routes/llm.rs",
  # Asset provenance: which upstream model and dataset each export pulls from.
  "server-rs/scripts/export_siglip2_fp16.py",
  "server-rs/scripts/export_bioclip2_fp16.py",
  "server-rs/scripts/pyproject.toml",
  # Plugin-side SDK version and bundled third-party Lua.
  "plugin/LrGeniusAI.lrdevplugin/Info.lua",
  "native/mlx-sidecar/Package.swift",
]

[page."Dev-Backend-API.md"]
sources = [
  "server-rs/crates/lrg-api/src/routes/*.rs",
  "plugin/LrGeniusAI.lrdevplugin/APISearchIndex.lua",
]

[page."Dev-Server-README.md"]
# Generated by scripts/build-wiki-pages.sh — edit the README, never the page.
generated_from = "server-rs/README.md"
sources = [
  "server-rs/crates/*/src/lib.rs",
  "server-rs/crates/lrg-common/src/config.rs",
  "server-rs/crates/lrg-ml/src/model_paths.rs",
  "server-rs/Cargo.toml",
]

[page."Dev-Build-Environment-Setup.md"]
