# geniusai-server (Rust backend) built from ./server-rs (local development).
# Model files aren't fetched at runtime yet — populate ./models yourself, see
# server-rs/scripts/export_siglip2_fp16.py and the Dockerfile's own comments.
#
# GENIUSAI_FACES_CLUSTER_* / GENIUSAI_BACKUP_* from the Python backend are
# intentionally omitted: the Rust backend has no periodic scheduler for
# face clustering or backups yet, so those env vars would currently be
# silently ignored.
#
# Local AI model (llama.cpp): set LLAMACPP=vulkan or LLAMACPP=cuda (amd64
# only) in .env or the shell to build it in, and hand the container a GPU
# below. The default, none, builds without one. See server-rs/Dockerfile.
#
# Start: docker compose -f docker-compose-dev.yml up -d --build
# Stop:  docker compose -f docker-compose-dev.yml down
# Token: docker exec geniusai-server /app/geniusai-server token
#        (paste it in Lightroom: Plug-in Manager > LrGeniusAI > Backend Server >
#        Access token; kept in ./data/LrGeniusAI/api-token)
# Logs:  docker compose -f docker-compose-dev.yml logs -f geniusai-server

services:
  geniusai-server:
    build:
      context: ./server-rs
      dockerfile: Dockerfile
      args:
        LLAMACPP: ${LLAMACPP:-none}
    image: geniusai-server:dev
    container_name: geniusai-server
    restart: unless-stopped
    ports:
      - "19819:19819"
    volumes:
      - ./data:/data
      - ./models:/models
    environment:
      - GENIUSAI_HOST=0.0.0.0
      - GENIUSAI_PORT=19819
    # LLAMACPP=vulkan, AMD or Intel GPU:
    # devices:
    #   - /dev/dri:/dev/dri
    # LLAMACPP=cuda or vulkan, NVIDIA GPU (needs the NVIDIA Container Toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
