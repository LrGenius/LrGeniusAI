repos:
  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.4.1
    hooks:
      - id: stylua-github
        # The specs too, not just the plugin: they are Lua written to the same
        # style, and leaving them out meant they drifted until someone ran
        # stylua over the directory by hand.
        files: ^plugin/(LrGeniusAI\.lrdevplugin|spec)/

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt (server-rs)
        entry: bash -c 'cd server-rs && cargo fmt --all'
        language: system
        files: ^server-rs/.*\.rs$
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy (server-rs)
        entry: bash -c 'cd server-rs && cargo clippy --workspace --all-targets -- -D warnings'
        language: system
        files: ^server-rs/.*\.rs$
        pass_filenames: false
      - id: check-docs
        name: docs match the code
        entry: python3 scripts/check-docs.py
        language: system
        # Routes, the plugin's endpoint table, the doc map, and CLAUDE.md /
        # AGENTS.md (which must mirror each other) are the only inputs the exact
        # checks read; staleness warnings surface in CI.
        files: ^(server-rs/crates/lrg-api/src/routes/|plugin/LrGeniusAI\.lrdevplugin/APISearchIndex\.lua|docs/|scripts/check-docs\.py$|CLAUDE\.md$|AGENTS\.md$)
        pass_filenames: false
      - id: develop-fixture-hygiene
        name: develop fixtures carry no private data
        # The fixtures under server-rs/testdata/develop are derived from the
        # maintainer's own edits and the repository is public. Stdlib-only, so
        # plain python3 is enough (no uv).
        entry: python3 server-rs/scripts/develop_registry/extract_fixtures.py --check-only --out-dir server-rs/testdata/develop/lua --root server-rs/testdata/develop
        language: system
        files: ^server-rs/(testdata/develop/|scripts/develop_registry/(extract_fixtures|outpath)\.py$)
        pass_filenames: false
