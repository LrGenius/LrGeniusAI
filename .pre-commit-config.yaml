repos:
  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.4.1
    hooks:
      - id: stylua-github
        files: ^plugin/LrGeniusAI.lrdevplugin/

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt (server-rs)
        entry: bash -c 'cd server-rs && cargo fmt --all'
        language: system
        files: ^server-rs/.*\.rs$
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy (server-rs)
        entry: bash -c 'cd server-rs && cargo clippy --workspace --all-targets -- -D warnings'
        language: system
        files: ^server-rs/.*\.rs$
        pass_filenames: false
