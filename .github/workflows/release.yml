name: Build and Release LrGeniusAI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      breaking_changes:
        description: 'Mark release as requiring full installer (dependency changes)'
        type: boolean
        default: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    name: Validate tag is on main
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Ensure tag commit is on main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_SHA="${GITHUB_SHA}"
          git fetch origin main
          if git branch -r --contains "$TAG_SHA" | grep -q "origin/main"; then
            echo "Tag commit is contained in origin/main."
          else
            echo "Error: Tag commit is not contained in origin/main."
            exit 1
          fi

  build-and-release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [validate-tag]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `cargo_features` is what makes the two platforms differ in which
          # local engine they ship. Windows builds llama.cpp (with the Vulkan
          # backend); macOS deliberately builds neither the feature nor its
          # prerequisites, because MLX is the only local engine there — see the
          # MLX sidecar steps below. Shipping llama.cpp alongside it would mean
          # compiling it from source on every release for an engine that is
          # slower on Apple silicon and that the plug-in no longer offers.
          - os: windows-latest
            os_name: windows
            arch: x64
            bin_ext: .exe
            cargo_features: --features llamacpp
          - os: macos-latest
            os_name: macos
            arch: arm64
            bin_ext: ''
            cargo_features: ''

    name: Build LrGeniusAI - ${{ matrix.os_name }}-${{ matrix.arch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update Info.lua with version and build date
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "$VERSION" == v[0-9]* ]]; then
            VERSION="${VERSION#v}"
          else
            # workflow_dispatch dry runs off a branch (no version tag) — fall
            # back to the same dev version the binary itself defaults to.
            VERSION="0.0.0-dev"
          fi
          # Info.lua's MAJOR/MINOR/REVISION are plain Lua number literals, so
          # drop any prerelease suffix (e.g. "3.0.0-pre3" -> "3.0.0") before
          # splitting — they may only contain numbers.
          VERSION_NUMERIC="${VERSION%%-*}"
          MAJOR=$(echo "$VERSION_NUMERIC" | cut -d. -f1)
          MINOR=$(echo "$VERSION_NUMERIC" | cut -d. -f2)
          REVISION=$(echo "$VERSION_NUMERIC" | cut -d. -f3)
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          REVISION=${REVISION:-0}
          BUILD_DATE=$(date +%Y%m%d)
          INFO_LUA="plugin/LrGeniusAI.lrdevplugin/Info.lua"
          sed 's/Info.MAJOR = .*/Info.MAJOR = '"$MAJOR"'/' "$INFO_LUA" > "$INFO_LUA.tmp" && mv "$INFO_LUA.tmp" "$INFO_LUA"
          sed 's/Info.MINOR = .*/Info.MINOR = '"$MINOR"'/' "$INFO_LUA" > "$INFO_LUA.tmp" && mv "$INFO_LUA.tmp" "$INFO_LUA"
          sed 's/Info.REVISION = .*/Info.REVISION = '"$REVISION"'/' "$INFO_LUA" > "$INFO_LUA.tmp" && mv "$INFO_LUA.tmp" "$INFO_LUA"
          sed 's/Info.BUILD = [0-9]*/build = '"$BUILD_DATE"'/' "$INFO_LUA" > "$INFO_LUA.tmp" && mv "$INFO_LUA.tmp" "$INFO_LUA"
          echo "Updated Info.lua: MAJOR=$MAJOR MINOR=$MINOR REVISION=$REVISION build=$BUILD_DATE"

      - name: Resolve backend version env vars from tag
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "$VERSION" == v[0-9]* ]]; then
            VERSION="${VERSION#v}"
          else
            # workflow_dispatch dry runs off a branch (no version tag) — fall
            # back to the same dev version the binary itself defaults to, so
            # the plugin<->backend version-check contract test still passes.
            VERSION="0.0.0-dev"
          fi
          BUILD_DATE=$(date +%Y%m%d)
          {
            echo "LRG_BACKEND_VERSION=${VERSION}"
            echo "LRG_BACKEND_RELEASE_TAG=v${VERSION}"
            echo "LRG_BACKEND_BUILD=${BUILD_DATE}"
          } >> "$GITHUB_ENV"
          echo "Backend version env: version=${VERSION} tag=v${VERSION} build=${BUILD_DATE}"

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      # The `llamacpp` feature compiles llama.cpp from source: cmake for the
      # build itself, libclang for bindgen. Installed explicitly rather than
      # relying on what a runner image happens to ship, because a missing
      # libclang surfaces as an opaque bindgen failure.
      #
      # Windows only. macOS builds without the feature (see `cargo_features` in
      # the matrix), so it needs none of this.
      - name: Install llama.cpp build prerequisites (Windows)
        if: matrix.os_name == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          choco install --no-progress -y llvm cmake ninja || true
          # Find libclang wherever LLVM landed rather than hard-coding a path
          # that changes with the runner image.
          for candidate in "/c/Program Files/LLVM/bin" "/c/ProgramData/chocolatey/lib/llvm/tools/LLVM/bin"; do
            if [ -f "$candidate/libclang.dll" ]; then
              echo "LIBCLANG_PATH=$(cygpath -w "$candidate")" >> "$GITHUB_ENV"
              echo "Found libclang in $candidate"
              break
            fi
          done
          if ! grep -q LIBCLANG_PATH "$GITHUB_ENV"; then
            echo "::error::libclang.dll not found; bindgen cannot run" && exit 1
          fi

          # Build llama.cpp with Ninja instead of cmake's default Visual Studio
          # generator. Not a preference — the VS generator cannot build the
          # Vulkan backend here. ggml-vulkan generates its shaders with a host
          # tool (`vulkan-shaders-gen`) pulled in via ExternalProject_Add, and
          # that CMakeLists sets CMP0147 NEW, which asks MSBuild to run custom
          # build steps in parallel. MSBuild then runs the external project's
          # steps out of order, so the install step fires before the configure
          # step has written cmake_install.cmake:
          #
          #   CMake error : Not a file: .../vulkan-shaders-gen-build/cmake_install.cmake
          #   The system cannot find the batch label specified - VCEnd
          #   error MSB8066: Custom build for '...vulkan-shaders-gen-install.rule;
          #                  ...vulkan-shaders-gen-complete.rule' exited with code 1
          #
          # Ninja expresses those steps as ordinary dependency edges, so they
          # cannot race, and it builds the whole thing faster besides. Only
          # llama-cpp-sys-2 uses the cmake crate in this workspace, so this
          # variable cannot affect any other dependency. cmake-rs skips the
          # -A/-T flags for Ninja and passes cl.exe plus its INCLUDE/LIB/PATH
          # environment through to cmake, which is also what lets the nested
          # vulkan-shaders-gen configure step find a compiler.
          if ! ninja --version; then
            echo "::error::ninja not on PATH; the Vulkan build needs it" && exit 1
          fi
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

          # Build into a short target dir, because the Vulkan backend cannot be
          # built from the default one on Windows. vulkan-shaders-gen is an
          # ExternalProject nested inside OUT_DIR, so its build tree carries the
          # whole prefix chain:
          #
          #   <target>/release/build/llama-cpp-sys-2-<hash>/out/build/ggml/src/
          #   ggml-vulkan/vulkan-shaders-gen-prefix/src/vulkan-shaders-gen-build/
          #   CMakeFiles/CMakeScratch/TryCompile-XXXXXX/CMakeFiles/cmTC_XXXXX.dir/
          #
          # From D:\a\LrGeniusAI\LrGeniusAI\server-rs\target that is 247 of the
          # 250 characters CMake allows for an object path, and cl.exe resolves
          # its relative /Fo against that directory — so the compiler check that
          # opens the sub-build fails on MAX_PATH before any shader is compiled:
          #
          #   testCCompiler.c : fatal error C1083: Cannot open compiler
          #                     generated file: '': Invalid argument
          #   -- Check for working C compiler: .../cl.exe - broken
          #
          # `D:\t` is on the same volume the workspace already builds in and
          # drops ~39 characters off every path, which clears the limit. Steps
          # that read build output go through $TARGET_DIR for this reason — and
          # it carries the POSIX spelling of the same directory, because the
          # MSYS `find`/`cp` in those bash steps would read a `D:\...` argument
          # as a relative path.
          echo 'CARGO_TARGET_DIR=D:\t' >> "$GITHUB_ENV"
          echo 'TARGET_DIR=/d/t' >> "$GITHUB_ENV"

      # Windows is the one target that enables llama.cpp's Vulkan backend (see
      # crates/lrg-llama/Cargo.toml), and that needs the Vulkan SDK: without it
      # llama-cpp-sys-2's build.rs panics outright ("Please install Vulkan SDK
      # and ensure that VULKAN_SDK env variable is set"), because it links
      # vulkan-1.lib from $VULKAN_SDK\Lib and ggml's CMake needs the SDK's
      # glslc to compile the compute shaders. A pinned version is preferred so
      # an SDK release cannot silently change a tagged build, with a fallback
      # to whatever LunarG currently calls latest so the release does not go
      # down the day that pinned build is retired from their CDN.
      - name: Install Vulkan SDK (Windows)
        if: matrix.os_name == 'windows'
        shell: pwsh
        env:
          VULKAN_SDK_VERSION: '1.4.357.0'
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'vulkan-sdk-installer.exe'

          # LunarG renamed the Windows installer after 1.4.309.0, so try the
          # current name first and the old one second — that way bumping the
          # pin in either direction keeps working.
          function Save-VulkanInstaller($v) {
            $base = "https://sdk.lunarg.com/sdk/download/$v/windows"
            foreach ($name in @("vulkansdk-windows-X64-$v.exe", "VulkanSDK-$v-Installer.exe")) {
              try {
                Invoke-WebRequest -Uri "$base/$name" -OutFile $installer -UseBasicParsing
                Write-Host "Downloaded $name"
                return $true
              } catch {
                Write-Host "Not available: $base/$name ($($_.Exception.Message))"
              }
            }
            return $false
          }

          $version = $env:VULKAN_SDK_VERSION
          if (-not (Save-VulkanInstaller $version)) {
            $latest = (Invoke-RestMethod -Uri 'https://vulkan.lunarg.com/sdk/latest.json' -UseBasicParsing).windows
            Write-Host "::warning::pinned Vulkan SDK $version is unavailable; falling back to latest ($latest). Update VULKAN_SDK_VERSION."
            if (-not $latest -or -not (Save-VulkanInstaller $latest)) {
              throw "could not download Vulkan SDK $version, nor the current latest"
            }
            $version = $latest
          }

          $sdkDir = "C:\VulkanSDK\$version"
          # The installer is a Qt Installer Framework GUI binary, so the shell
          # does not wait for it on its own — hence Start-Process -Wait.
          $proc = Start-Process -FilePath $installer -Wait -PassThru -NoNewWindow -ArgumentList @(
            '--root', $sdkDir, '--accept-licenses', '--default-answer', '--confirm-command', 'install'
          )
          if ($proc.ExitCode -ne 0) {
            throw "Vulkan SDK installer exited with $($proc.ExitCode)"
          }

          foreach ($required in @("$sdkDir\Lib\vulkan-1.lib", "$sdkDir\Bin\glslc.exe")) {
            if (-not (Test-Path $required)) {
              throw "Vulkan SDK install incomplete: $required is missing"
            }
          }

          "VULKAN_SDK=$sdkDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$sdkDir\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "Vulkan SDK $version installed at $sdkDir"

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server-rs

      - name: Run backend test suite
        shell: bash
        run: |
          cd server-rs
          cargo test --workspace --release ${{ matrix.cargo_features }}

      - name: Build backend binary (release)
        shell: bash
        run: |
          cd server-rs
          cargo build --release --bin geniusai-server ${{ matrix.cargo_features }}
          cargo clippy --workspace --tests ${{ matrix.cargo_features }} -- -D warnings

      # The MLX sidecar (Apple silicon only). Two things are non-obvious here:
      #
      #  * it must be built with `xcodebuild`, not `swift build`. mlx-swift's
      #    README is explicit that SwiftPM on the command line cannot compile
      #    the Metal shaders, and a binary built that way dies at runtime with
      #    "Failed to load the default metallib".
      #  * Xcode 26 ships the Metal compiler as a separate downloadable
      #    component, so it has to be fetched before the shaders will build.
      #
      # `-skipPackagePluginValidation` is required because mlx-swift carries a
      # build plugin (CudaBuild) that Xcode otherwise stops to ask about, which
      # a non-interactive runner can never answer.
      - name: Build MLX sidecar (macOS)
        if: matrix.os_name == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain
          cd native/mlx-sidecar
          xcodebuild build \
            -scheme lrgenius-mlx \
            -destination 'platform=macOS,arch=arm64' \
            -configuration Release \
            -derivedDataPath .build/xcode \
            -skipPackagePluginValidation \
            -skipMacroValidation

      - name: Stage MLX sidecar (macOS)
        if: matrix.os_name == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS="native/mlx-sidecar/.build/xcode/Build/Products/Release"
          BUILD_DIR="build/mlx-sidecar"
          mkdir -p "$BUILD_DIR"
          cp "$PRODUCTS/lrgenius-mlx" "$BUILD_DIR/"
          # The Metal kernels live in mlx-swift_Cmlx.bundle and are located
          # relative to the executable at runtime, so they travel with it.
          bundles=0
          for bundle in "$PRODUCTS"/*.bundle; do
            [ -e "$bundle" ] || continue
            cp -a "$bundle" "$BUILD_DIR/"
            bundles=$((bundles + 1))
          done
          # Hard failure rather than a warning: MLX is the only local engine on
          # macOS, and a sidecar shipped without its metallib does not fail at
          # build time — it starts and then dies on the first inference with
          # "Failed to load the default metallib". Catching that here is the
          # difference between a red build and a release that looks fine until a
          # user tries to analyse a photo.
          if [ "$bundles" -eq 0 ]; then
            echo "::error::no .bundle staged next to lrgenius-mlx; the Metal kernels are missing" && exit 1
          fi
          ls -la "$BUILD_DIR"

      - name: Stage backend binary
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="build/lrgenius-server"
          mkdir -p "$BUILD_DIR"
          # Windows overrides CARGO_TARGET_DIR to keep llama.cpp's build paths
          # under MAX_PATH (see the prerequisites step); everywhere else the
          # workspace default applies.
          TARGET_DIR="${TARGET_DIR:-server-rs/target}"
          cp "$TARGET_DIR/release/geniusai-server${{ matrix.bin_ext }}" "$BUILD_DIR/lrgenius-server${{ matrix.bin_ext }}"
          if [ "${{ matrix.os_name }}" != "windows" ]; then
            chmod +x "$BUILD_DIR/lrgenius-server"
          fi

          # Windows builds llama.cpp's Vulkan backend as a loadable ggml module
          # (`dynamic-backends`), so the ggml-*.dll files have to travel next to
          # the exe or the server starts with no GPU support at all. macOS has
          # nothing to stage here at all: it builds without the `llamacpp`
          # feature, and its local engine is the MLX sidecar staged above.
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            found=0
            # Two locations, because llama-cpp-sys-2 treats them differently:
            # it hard-links the shared libs it installs into OUT_DIR/bin (ggml,
            # ggml-base, llama) up into target/release, but the *loadable*
            # backend modules — ggml-vulkan and the ggml-cpu-* variants, which
            # are the ones that actually compute — are installed to
            # OUT_DIR/backends and left there. Collecting only the first set
            # ships an exe whose ggml_backend_load_all() finds nothing next to
            # it, i.e. no GPU *and* no CPU inference.
            while IFS= read -r dll; do
              cp "$dll" "$BUILD_DIR/"
              found=$((found + 1))
            done < <(
              find "$TARGET_DIR/release" -maxdepth 1 \( -name 'ggml*.dll' -o -name 'llama.dll' \) -print
              find "$TARGET_DIR/release/build" -path '*/out/backends/*' -name 'ggml*.dll' -print
            )
            # llama.dll is not optional the way a backend module is: the exe
            # imports it directly and will not start without it.
            if [ ! -f "$BUILD_DIR/llama.dll" ]; then
              echo "::error::llama.dll missing; the packaged exe would not start" && exit 1
            fi
            echo "Staged $found ggml backend DLL(s)"
            if [ "$found" -eq 0 ]; then
              echo "::error::no ggml*.dll found; a dynamic-backends build must produce them" && exit 1
            fi

            # The Vulkan module is the entire point of the Windows build, so a
            # missing one is a hard failure: shipping a silently GPU-less (and
            # here, backend-less) binary is worse than failing the release.
            if ! ls "$BUILD_DIR"/ggml-vulkan*.dll >/dev/null 2>&1; then
              echo "::error::no ggml-vulkan*.dll staged; the Vulkan backend did not build" && exit 1
            fi
          fi

          echo "=== Staged binary ==="
          ls -lh "$BUILD_DIR"
          # The ggml backend modules dominate the download size of the
          # installer, so make the number easy to find in the log.
          echo "=== Staged payload size: $(du -sh "$BUILD_DIR" | cut -f1) ==="

      - name: Prepare plugin files
        shell: bash
        run: |
          BUILD_DIR="build"
          PLUGIN_DIR="$BUILD_DIR/LrGeniusAI.lrplugin"

          mkdir -p $PLUGIN_DIR

          echo "Copying plugin files..."
          cp plugin/LrGeniusAI.lrdevplugin/*.lua $PLUGIN_DIR/

      # macOS Developer ID codesigning + notarization. Skipped (with a
      # warning, not a failure) when the secrets aren't configured, so
      # forks/dev builds still work before signing is set up.
      - name: Import macOS signing certificates
        if: matrix.os_name == 'macos'
        id: macos-certs
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERTIFICATE_P12_BASE64:-}" ] || [ -z "${MACOS_INSTALLER_CERTIFICATE_P12_BASE64:-}" ]; then
            echo "macOS signing secrets not configured — building unsigned (dev) artifact."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          APP_CERT_PATH="$RUNNER_TEMP/app_cert.p12"
          INSTALLER_CERT_PATH="$RUNNER_TEMP/installer_cert.p12"

          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$APP_CERT_PATH"
          echo "$MACOS_INSTALLER_CERTIFICATE_P12_BASE64" | base64 --decode > "$INSTALLER_CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$APP_CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security import "$INSTALLER_CERT_PATH" -P "$MACOS_INSTALLER_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$APP_CERT_PATH" "$INSTALLER_CERT_PATH"

          APP_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          INSTALLER_IDENTITY="$(security find-identity -v "$KEYCHAIN_PATH" | grep 'Developer ID Installer' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          if [ -z "$APP_IDENTITY" ] || [ -z "$INSTALLER_IDENTITY" ]; then
            echo "Error: expected identities not found in imported certificates."
            security find-identity -v "$KEYCHAIN_PATH"
            exit 1
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "MACOS_SIGN_IDENTITY=$APP_IDENTITY" >> "$GITHUB_ENV"
          echo "MACOS_INSTALLER_SIGN_IDENTITY=$INSTALLER_IDENTITY" >> "$GITHUB_ENV"
          echo "Imported signing identities: app=$APP_IDENTITY installer=$INSTALLER_IDENTITY"
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12_BASE64 }}
          MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}

      - name: Build macOS installer
        if: matrix.os_name == 'macos'
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "$VERSION" == v[0-9]* ]]; then
            VERSION="${VERSION#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "Building macOS .pkg installer..."
          chmod +x installers/macos/build_pkg.sh
          ./installers/macos/build_pkg.sh "$VERSION" "${{ matrix.arch }}"

      - name: Notarize macOS installer
        if: matrix.os_name == 'macos' && steps.macos-certs.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          if [[ "$VERSION" == v[0-9]* ]]; then
            VERSION="${VERSION#v}"
          else
            VERSION="0.0.0-dev"
          fi
          PKG_PATH="LrGeniusAI-macos-${{ matrix.arch }}-${VERSION}.pkg"
          KEY_PATH="$RUNNER_TEMP/notary_key.p8"
          echo "$APPLE_NOTARIZATION_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"

          echo "Submitting $PKG_PATH for notarization (this can take a few minutes)..."
          xcrun notarytool submit "$PKG_PATH" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_NOTARIZATION_KEY_ID" \
            --issuer "$APPLE_NOTARIZATION_ISSUER_ID" \
            --wait

          echo "Stapling notarization ticket..."
          xcrun stapler staple "$PKG_PATH"
          rm -f "$KEY_PATH"
        env:
          APPLE_NOTARIZATION_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARIZATION_KEY_P8_BASE64 }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}

      # SignPath Foundation (Windows Authenticode) signing of the backend
      # binary and the loadable ggml backend DLLs beside it, before they get
      # packaged into the installer below. The whole directory is submitted
      # rather than just the exe: the DLLs are PE files loaded at runtime, so
      # leaving them unsigned undercuts signing the exe at all.
      - name: Upload unsigned backend binaries for signing
        if: matrix.os_name == 'windows'
        id: upload-unsigned-exe
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-backend-exe-${{ matrix.arch }}
          path: build/lrgenius-server/
          retention-days: 1

      - name: Submit backend exe to SignPath
        if: matrix.os_name == 'windows'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: deae5ebd-e056-4961-9aed-a3a047da535d
          project-slug: LrGeniusAI
          signing-policy-slug: test-signing
          github-artifact-id: ${{ steps.upload-unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-backend-exe

      - name: Replace backend binaries with SignPath-signed versions
        if: matrix.os_name == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          # Copy back whatever came out signed, tolerating either layout: a
          # signing policy configured for a single file returns just the exe,
          # and in that case the DLLs stay as built rather than going missing.
          copied=0
          while IFS= read -r f; do
            cp "$f" "build/lrgenius-server/$(basename "$f")"
            copied=$((copied + 1))
          done < <(find signed-backend-exe -type f \( -name '*.exe' -o -name '*.dll' \) -print)
          echo "Replaced $copied signed file(s)"
          if [ "$copied" -eq 0 ]; then
            echo "::error::SignPath returned no signed binaries" && exit 1
          fi
          if ! find signed-backend-exe -name 'lrgenius-server.exe' | grep -q .; then
            echo "::error::signed lrgenius-server.exe missing from SignPath output" && exit 1
          fi
          ls -lh build/lrgenius-server/

      - name: Build Windows installer
        if: matrix.os_name == 'windows'
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "$VERSION" == v[0-9]* ]]; then
            VERSION="${VERSION#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "Building Windows .exe installer with Inno Setup..."
          # Inno Setup is pre-installed on windows-latest
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          MSYS_NO_PATHCONV=1 "$ISCC" /DAppVersion="$VERSION" /O"installers/windows/Output" installers/windows/setup.iss
          # Match the installer even if the OutputDir logic in the .iss varies
          find . -name "*.exe" -path "*/Output/*" -exec mv {} . \; -quit || mv installers/windows/Output/*.exe .

      # SignPath Foundation signing of the final installer .exe.
      - name: Locate unsigned installer
        if: matrix.os_name == 'windows'
        id: locate-installer
        shell: bash
        run: |
          set -euo pipefail
          echo "path=$(ls LrGeniusAI-windows-x64-*.exe)" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned installer for signing
        if: matrix.os_name == 'windows'
        id: upload-unsigned-installer
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer-${{ matrix.arch }}
          path: ${{ steps.locate-installer.outputs.path }}
          retention-days: 1

      - name: Submit installer to SignPath
        if: matrix.os_name == 'windows'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: deae5ebd-e056-4961-9aed-a3a047da535d
          project-slug: LrGeniusAI
          signing-policy-slug: test-signing
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installer

      - name: Replace installer with SignPath-signed version
        if: matrix.os_name == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          cp "signed-installer/$(basename "${{ steps.locate-installer.outputs.path }}")" "${{ steps.locate-installer.outputs.path }}"

      - name: Smoke test packaged backend and log cold start
        shell: bash
        run: |
          set -euo pipefail
          DB_DIR="$RUNNER_TEMP/lrgenius-smoke-db"
          DB_PATH="$DB_DIR/lrgenius.db"
          LOG_PATH="$DB_DIR/lrgenius-server.log"
          SMOKE_STDOUT="$DB_DIR/smoke-backend.out"
          mkdir -p "$DB_DIR"
          URL="http://127.0.0.1:19819/ping"
          START_TS=$(python3 -c "import time; print(time.time())")

          BIN="$GITHUB_WORKSPACE/build/lrgenius-server/lrgenius-server${{ matrix.bin_ext }}"
          if [ "${{ matrix.os_name }}" != "windows" ]; then
            chmod +x "$BIN"
          fi
          "$BIN" --db-path "$DB_PATH" >"$SMOKE_STDOUT" 2>&1 &
          BACKEND_PID=$!

          READY=0
          for i in $(seq 1 600); do
            if curl -sf "$URL" | grep -q "pong"; then
              READY=1
              break
            fi
            if ! kill -0 "$BACKEND_PID" 2>/dev/null; then
              echo "Backend process exited early before /ping became ready."
              break
            fi
            if [ $((i % 120)) -eq 0 ]; then
              echo "Still waiting for backend readiness... (${i}/600)"
            fi
            sleep 0.5
          done

          if [ "$READY" -ne 1 ]; then
            echo "Backend smoke test failed: /ping did not return pong in time."
            if [ -f "$LOG_PATH" ]; then
              echo "---- backend log tail ----"
              tail -n 120 "$LOG_PATH" || true
              echo "--------------------------"
            fi
            if [ -f "$SMOKE_STDOUT" ]; then
              echo "---- launcher stdout/stderr ----"
              tail -n 120 "$SMOKE_STDOUT" || true
              echo "--------------------------------"
            fi
            exit 1
          fi

          END_TS=$(python3 -c "import time; print(time.time())")
          COLD_START_SECONDS=$(python3 -c "import sys; print(f'{float(sys.argv[2]) - float(sys.argv[1]):.2f}')" "$START_TS" "$END_TS")
          echo "Measured cold start to /ping: ${COLD_START_SECONDS}s"

          curl -sf -X POST "http://127.0.0.1:19819/shutdown" || true

      - name: Pack artifact payload
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_DIR="artifact-payload"
          ARTIFACT_TAR="lrgenius-ai-${{ matrix.os_name }}-${{ matrix.arch }}.tar"
          mkdir -p "$ARTIFACT_DIR"
          tar -C build -cf "$ARTIFACT_DIR/$ARTIFACT_TAR" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: lrgenius-ai-${{ matrix.os_name }}-${{ matrix.arch }}
          path: |
            artifact-payload/lrgenius-ai-${{ matrix.os_name }}-${{ matrix.arch }}.tar
            *.pkg
            *.exe
          retention-days: 1
          compression-level: 9

  build-plugin-only:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [validate-tag]
    runs-on: ubuntu-latest
    name: Build Plugin Only

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update Info.lua with version and build date
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "$VERSION" == v[0-9]* ]]; then
            VERSION="${VERSION#v}"
          else
            VERSION="0.0.0-dev"
          fi
          # Info.lua's MAJOR/MINOR/REVISION are plain Lua number literals, so
          # drop any prerelease suffix (e.g. "3.0.0-pre3" -> "3.0.0") before
          # splitting — they may only contain numbers.
          VERSION_NUMERIC="${VERSION%%-*}"
          MAJOR=$(echo "$VERSION_NUMERIC" | cut -d. -f1)
          MINOR=$(echo "$VERSION_NUMERIC" | cut -d. -f2)
          REVISION=$(echo "$VERSION_NUMERIC" | cut -d. -f3)
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          REVISION=${REVISION:-0}
          BUILD_DATE=$(date +%Y%m%d)
          INFO_LUA="plugin/LrGeniusAI.lrdevplugin/Info.lua"
          sed 's/Info.MAJOR = .*/Info.MAJOR = '"$MAJOR"'/' "$INFO_LUA" > "$INFO_LUA.tmp" && mv "$INFO_LUA.tmp" "$INFO_LUA"
          sed 's/Info.MINOR = .*/Info.MINOR = '"$MINOR"'/' "$INFO_LUA" > "$INFO_LUA.tmp" && mv "$INFO_LUA.tmp" "$INFO_LUA"
          sed 's/Info.REVISION = .*/Info.REVISION = '"$REVISION"'/' "$INFO_LUA" > "$INFO_LUA.tmp" && mv "$INFO_LUA.tmp" "$INFO_LUA"
          sed 's/Info.BUILD = [0-9]*/build = '"$BUILD_DATE"'/' "$INFO_LUA" > "$INFO_LUA.tmp" && mv "$INFO_LUA.tmp" "$INFO_LUA"
          echo "Updated Info.lua: MAJOR=$MAJOR MINOR=$MINOR REVISION=$REVISION build=$BUILD_DATE"

      - name: Prepare plugin-only files
        shell: bash
        run: |
          BUILD_DIR="build-plugin-only"
          mkdir -p "$BUILD_DIR"
          cp -r plugin/LrGeniusAI.lrdevplugin "$BUILD_DIR/"

      - name: Pack plugin-only artifact payload
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_DIR="artifact-payload"
          ARTIFACT_TAR="lrgenius-ai-plugin-docker-backend.tar"
          mkdir -p "$ARTIFACT_DIR"
          tar -C build-plugin-only -cf "$ARTIFACT_DIR/$ARTIFACT_TAR" .

      - name: Upload plugin-only artifact
        uses: actions/upload-artifact@v7
        with:
          name: lrgenius-ai-plugin-docker-backend
          path: artifact-payload/lrgenius-ai-plugin-docker-backend.tar
          retention-days: 1

  build-docker-images:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: x64
            docker_platform: linux/amd64
          # - arch: aarch64
          #   docker_platform: linux/arm64

    name: Build Docker Image - ${{ matrix.arch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve backend version build-args from tag
        id: backend-version
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          BUILD_DATE=$(date +%Y%m%d)
          {
            echo "version=${VERSION}"
            echo "release_tag=v${VERSION}"
            echo "build=${BUILD_DATE}"
          } >> "$GITHUB_OUTPUT"
          echo "Backend version build-args: version=${VERSION} build=${BUILD_DATE}"

      - name: Prepare image name
        id: image-name
        shell: bash
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "registry_image=ghcr.io/${OWNER_LC}/lrgeniusai" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./server-rs
          file: ./server-rs/Dockerfile
          platforms: ${{ matrix.docker_platform }}
          push: true
          build-args: |
            LRG_BACKEND_VERSION=${{ steps.backend-version.outputs.version }}
            LRG_BACKEND_RELEASE_TAG=${{ steps.backend-version.outputs.release_tag }}
            LRG_BACKEND_BUILD=${{ steps.backend-version.outputs.build }}
          tags: ${{ steps.image-name.outputs.registry_image }}:${{ github.ref_name }}-${{ matrix.arch }}
          cache-from: type=gha,scope=lrgeniusai-server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=lrgeniusai-server-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: false
          sbom: false
          # generate-summary: false

  # Combine per-arch pushes into one multi-arch :latest so `docker compose pull` works
  # with ghcr.io/.../lrgeniusai:latest (amd64 and arm64 clients resolve correctly).
  publish-docker-manifest:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-docker-images, create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    name: Publish Docker latest manifest

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Create and push multi-arch latest
        shell: bash
        run: |
          set -euo pipefail
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMG="ghcr.io/${OWNER_LC}/lrgeniusai"
          TAG="${{ github.ref_name }}"
          docker buildx imagetools create \
            --tag "${IMG}:latest" \
            "${IMG}:${TAG}-x64" 

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-release, build-plugin-only]
    runs-on: ubuntu-latest
    name: Create Release
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: lrgenius-ai-*
          path: artifacts

      - name: Zip artifacts
        run: |
          VERSION=${{ github.ref_name }}

          cd artifacts

          for ARTIFACT_DIR in lrgenius-ai-windows-x64 lrgenius-ai-macos-arm64 lrgenius-ai-plugin-docker-backend; do
            if [ -d "$ARTIFACT_DIR" ]; then
              TAR_PATH="$(echo "$ARTIFACT_DIR"/*.tar)"
              if [ -f "$TAR_PATH" ]; then
                tar -xf "$TAR_PATH" -C "$ARTIFACT_DIR"
                rm -f "$TAR_PATH"
              fi
            fi
          done

          # actions/download-artifact normalizes permissions, so restore the executable bit before zipping.
          if [ -d "lrgenius-ai-macos-arm64" ]; then
            chmod +x lrgenius-ai-macos-arm64/lrgenius-server/lrgenius-server || true
          fi

          if [ -d "lrgenius-ai-windows-x64" ]; then
            cd lrgenius-ai-windows-x64
            zip -r ../LrGeniusAI-windows-x64-${VERSION}.zip .
            cd ..
          fi

          if [ -d "lrgenius-ai-macos-arm64" ]; then
            cd lrgenius-ai-macos-arm64
            zip -r ../LrGeniusAI-macos-arm64-${VERSION}.zip .
            cd ..
          fi

          if [ -d "lrgenius-ai-plugin-docker-backend" ]; then
            cd lrgenius-ai-plugin-docker-backend
            zip -r ../LrGeniusAI-plugin-docker-backend-${VERSION}.zip .
            cd ..
          fi

          cd ..

      - name: Set release metadata
        id: release-meta
        run: |
          VERSION="${{ github.ref_name }}"
          echo "release_name=Release ${VERSION}" >> $GITHUB_OUTPUT

      # The self-updater swaps the raw binary in place — it must NOT run
      # the full installer (UAC prompts / GUI wizard / plugin re-copy).
      # These are published as their own release assets, distinct from
      # the .pkg/.exe installers used for fresh installs.
      - name: Stage raw binaries for self-update manifest
        run: |
          set -euo pipefail
          mkdir -p update-assets
          if [ -f artifacts/lrgenius-ai-macos-arm64/lrgenius-server/lrgenius-server ]; then
            cp artifacts/lrgenius-ai-macos-arm64/lrgenius-server/lrgenius-server update-assets/lrgenius-server-macos-arm64
            chmod +x update-assets/lrgenius-server-macos-arm64
          fi
          if [ -f artifacts/lrgenius-ai-windows-x64/lrgenius-server/lrgenius-server.exe ]; then
            cp artifacts/lrgenius-ai-windows-x64/lrgenius-server/lrgenius-server.exe update-assets/lrgenius-server-windows-x64.exe
          fi
          echo "=== Staged self-update binaries ==="
          ls -la update-assets/

      - name: Generate update manifest
        run: |
          VERSION="${{ github.ref_name }}"
          BREAKING_FLAG=""
          if [[ "${{ github.event.inputs.breaking_changes }}" == "true" ]]; then
            BREAKING_FLAG="--breaking"
          fi
          BINARY_ARGS=()
          [ -f update-assets/lrgenius-server-macos-arm64 ] && BINARY_ARGS+=(--binary "macos-arm64=update-assets/lrgenius-server-macos-arm64")
          [ -f update-assets/lrgenius-server-windows-x64.exe ] && BINARY_ARGS+=(--binary "windows-x64=update-assets/lrgenius-server-windows-x64.exe")
          python3 scripts/generate_update_manifest.py \
            --version "${VERSION}" \
            --repo "${{ github.repository }}" \
            --output "update-manifest-${VERSION}.json" \
            "${BINARY_ARGS[@]}" \
            ${BREAKING_FLAG}
          echo "Generated update-manifest-${VERSION}.json"
          cat "update-manifest-${VERSION}.json" | python3 -c "import sys,json; m=json.load(sys.stdin); print(f'Manifest: {len(m[\"platforms\"])} platform binaries, {len(m[\"plugin_files\"])} plugin files, breaking={m[\"breaking_changes\"]}')"

      # Rewrites the changelog for the people who actually install this: the
      # release body becomes New/Improved/Fixed sections sorted from PR labels
      # and title prefixes, with GitHub's PR-title list kept in a collapsed
      # section underneath. Reads the manifest generated above to say whether
      # the in-Lightroom updater can handle this release or the full installer
      # is required, so this step must run after it. Never fails the release —
      # if nothing classifies as user-facing it falls back to the
      # auto-generated changelog and logs a warning.
      - name: Generate user-facing release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          python3 scripts/generate_release_notes.py \
            --repo "${{ github.repository }}" \
            --tag "${VERSION}" \
            --manifest "update-manifest-${VERSION}.json" \
            --output release_notes.md
          echo "=== Release body ==="
          cat release_notes.md

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.release-meta.outputs.release_name }}
          body_path: release_notes.md
          files: |
            artifacts/LrGeniusAI-plugin-docker-backend-${{ github.ref_name }}.zip
            artifacts/lrgenius-ai-macos-arm64/*.pkg
            artifacts/lrgenius-ai-windows-x64/*.exe
            update-assets/*
            update-manifest-${{ github.ref_name }}.json
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
