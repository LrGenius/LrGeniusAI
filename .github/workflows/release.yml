name: Build and Release LrGeniusAI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      breaking_changes:
        description: 'Mark release as requiring full installer (dependency changes)'
        type: boolean
        default: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    name: Validate tag is on main
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Ensure tag commit is on main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_SHA="${GITHUB_SHA}"
          git fetch origin main
          if git branch -r --contains "$TAG_SHA" | grep -q "origin/main"; then
            echo "Tag commit is contained in origin/main."
          else
            echo "Error: Tag commit is not contained in origin/main."
            exit 1
          fi

  build-and-release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [validate-tag]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: windows
            arch: x64
            bin_ext: .exe
          - os: macos-latest
            os_name: macos
            arch: arm64
            bin_ext: ''
          - os: ubuntu-latest
            os_name: linux
            arch: x64
            bin_ext: ''

    name: Build LrGeniusAI - ${{ matrix.os_name }}-${{ matrix.arch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update Info.lua with version and build date
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "$VERSION" == v[0-9]* ]]; then
            VERSION="${VERSION#v}"
          else
            # workflow_dispatch dry runs off a branch (no version tag) — fall
            # back to the same dev version the binary itself defaults to.
            VERSION="0.0.0-dev"
          fi
          # Info.lua's MAJOR/MINOR/REVISION are plain Lua number literals, so
          # drop any prerelease suffix (e.g. "3.0.0-pre3" -> "3.0.0") before
          # splitting — they may only contain numbers.
          VERSION_NUMERIC="${VERSION%%-*}"
          MAJOR=$(echo "$VERSION_NUMERIC" | cut -d. -f1)
          MINOR=$(echo "$VERSION_NUMERIC" | cut -d. -f2)
          REVISION=$(echo "$VERSION_NUMERIC" | cut -d. -f3)
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          REVISION=${REVISION:-0}
          BUILD_DATE=$(date +%Y%m%d)
          INFO_LUA="plugin/LrGeniusAI.lrdevplugin/Info.lua"
          sed 's/Info.MAJOR = .*/Info.MAJOR = '"$MAJOR"'/' "$INFO_LUA" > "$INFO_LUA.tmp" && mv "$INFO_LUA.tmp" "$INFO_LUA"
          sed 's/Info.MINOR = .*/Info.MINOR = '"$MINOR"'/' "$INFO_LUA" > "$INFO_LUA.tmp" && mv "$INFO_LUA.tmp" "$INFO_LUA"
          sed 's/Info.REVISION = .*/Info.REVISION = '"$REVISION"'/' "$INFO_LUA" > "$INFO_LUA.tmp" && mv "$INFO_LUA.tmp" "$INFO_LUA"
          sed 's/Info.BUILD = [0-9]*/build = '"$BUILD_DATE"'/' "$INFO_LUA" > "$INFO_LUA.tmp" && mv "$INFO_LUA.tmp" "$INFO_LUA"
          echo "Updated Info.lua: MAJOR=$MAJOR MINOR=$MINOR REVISION=$REVISION build=$BUILD_DATE"

      - name: Resolve backend version env vars from tag
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "$VERSION" == v[0-9]* ]]; then
            VERSION="${VERSION#v}"
          else
            # workflow_dispatch dry runs off a branch (no version tag) — fall
            # back to the same dev version the binary itself defaults to, so
            # the plugin<->backend version-check contract test still passes.
            VERSION="0.0.0-dev"
          fi
          BUILD_DATE=$(date +%Y%m%d)
          {
            echo "LRG_BACKEND_VERSION=${VERSION}"
            echo "LRG_BACKEND_RELEASE_TAG=v${VERSION}"
            echo "LRG_BACKEND_BUILD=${BUILD_DATE}"
          } >> "$GITHUB_ENV"
          echo "Backend version env: version=${VERSION} tag=v${VERSION} build=${BUILD_DATE}"

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rs

      - name: Run backend test suite
        shell: bash
        run: |
          cd server-rs
          cargo test --workspace --release

      - name: Build backend binary (release)
        shell: bash
        run: |
          cd server-rs
          cargo build --release --bin geniusai-server
          cargo clippy --workspace --tests -- -D warnings

      - name: Stage backend binary
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="build/lrgenius-server"
          mkdir -p "$BUILD_DIR"
          cp "server-rs/target/release/geniusai-server${{ matrix.bin_ext }}" "$BUILD_DIR/lrgenius-server${{ matrix.bin_ext }}"
          if [ "${{ matrix.os_name }}" != "windows" ]; then
            chmod +x "$BUILD_DIR/lrgenius-server"
          fi
          echo "=== Staged binary ==="
          ls -lh "$BUILD_DIR"

      - name: Prepare plugin files
        shell: bash
        run: |
          BUILD_DIR="build"
          PLUGIN_DIR="$BUILD_DIR/LrGeniusAI.lrplugin"

          mkdir -p $PLUGIN_DIR

          echo "Copying plugin files..."
          cp plugin/LrGeniusAI.lrdevplugin/*.lua $PLUGIN_DIR/
          cp plugin/LrGeniusAI.lrdevplugin/TranslatedStrings_*.txt $PLUGIN_DIR/

      # macOS Developer ID codesigning + notarization. Skipped (with a
      # warning, not a failure) when the secrets aren't configured, so
      # forks/dev builds still work before signing is set up.
      - name: Import macOS signing certificates
        if: matrix.os_name == 'macos'
        id: macos-certs
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERTIFICATE_P12_BASE64:-}" ] || [ -z "${MACOS_INSTALLER_CERTIFICATE_P12_BASE64:-}" ]; then
            echo "macOS signing secrets not configured — building unsigned (dev) artifact."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          APP_CERT_PATH="$RUNNER_TEMP/app_cert.p12"
          INSTALLER_CERT_PATH="$RUNNER_TEMP/installer_cert.p12"

          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$APP_CERT_PATH"
          echo "$MACOS_INSTALLER_CERTIFICATE_P12_BASE64" | base64 --decode > "$INSTALLER_CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$APP_CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security import "$INSTALLER_CERT_PATH" -P "$MACOS_INSTALLER_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$APP_CERT_PATH" "$INSTALLER_CERT_PATH"

          APP_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          INSTALLER_IDENTITY="$(security find-identity -v "$KEYCHAIN_PATH" | grep 'Developer ID Installer' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          if [ -z "$APP_IDENTITY" ] || [ -z "$INSTALLER_IDENTITY" ]; then
            echo "Error: expected identities not found in imported certificates."
            security find-identity -v "$KEYCHAIN_PATH"
            exit 1
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "MACOS_SIGN_IDENTITY=$APP_IDENTITY" >> "$GITHUB_ENV"
          echo "MACOS_INSTALLER_SIGN_IDENTITY=$INSTALLER_IDENTITY" >> "$GITHUB_ENV"
          echo "Imported signing identities: app=$APP_IDENTITY installer=$INSTALLER_IDENTITY"
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12_BASE64 }}
          MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}

      - name: Build macOS installer
        if: matrix.os_name == 'macos'
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "$VERSION" == v[0-9]* ]]; then
            VERSION="${VERSION#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "Building macOS .pkg installer..."
          chmod +x installers/macos/build_pkg.sh
          ./installers/macos/build_pkg.sh "$VERSION" "${{ matrix.arch }}"

      - name: Notarize macOS installer
        if: matrix.os_name == 'macos' && steps.macos-certs.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          if [[ "$VERSION" == v[0-9]* ]]; then
            VERSION="${VERSION#v}"
          else
            VERSION="0.0.0-dev"
          fi
          PKG_PATH="LrGeniusAI-macos-${{ matrix.arch }}-${VERSION}.pkg"
          KEY_PATH="$RUNNER_TEMP/notary_key.p8"
          echo "$APPLE_NOTARIZATION_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"

          echo "Submitting $PKG_PATH for notarization (this can take a few minutes)..."
          xcrun notarytool submit "$PKG_PATH" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_NOTARIZATION_KEY_ID" \
            --issuer "$APPLE_NOTARIZATION_ISSUER_ID" \
            --wait

          echo "Stapling notarization ticket..."
          xcrun stapler staple "$PKG_PATH"
          rm -f "$KEY_PATH"
        env:
          APPLE_NOTARIZATION_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARIZATION_KEY_P8_BASE64 }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}

      # SignPath Foundation (Windows Authenticode) signing of the single
      # Rust binary, before it gets packaged into the installer below.
      - name: Upload unsigned backend exe for signing
        if: matrix.os_name == 'windows'
        id: upload-unsigned-exe
        uses: actions/upload-artifact@v6
        with:
          name: unsigned-backend-exe-${{ matrix.arch }}
          path: build/lrgenius-server/lrgenius-server.exe
          retention-days: 1

      - name: Submit backend exe to SignPath
        if: matrix.os_name == 'windows'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: deae5ebd-e056-4961-9aed-a3a047da535d
          project-slug: LrGeniusAI
          signing-policy-slug: test-signing
          github-artifact-id: ${{ steps.upload-unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-backend-exe

      - name: Replace backend exe with SignPath-signed version
        if: matrix.os_name == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          cp signed-backend-exe/lrgenius-server.exe build/lrgenius-server/lrgenius-server.exe

      - name: Build Windows installer
        if: matrix.os_name == 'windows'
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "$VERSION" == v[0-9]* ]]; then
            VERSION="${VERSION#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "Building Windows .exe installer with Inno Setup..."
          # Inno Setup is pre-installed on windows-latest
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          MSYS_NO_PATHCONV=1 "$ISCC" /DAppVersion="$VERSION" /O"installers/windows/Output" installers/windows/setup.iss
          # Match the installer even if the OutputDir logic in the .iss varies
          find . -name "*.exe" -path "*/Output/*" -exec mv {} . \; -quit || mv installers/windows/Output/*.exe .

      # SignPath Foundation signing of the final installer .exe.
      - name: Locate unsigned installer
        if: matrix.os_name == 'windows'
        id: locate-installer
        shell: bash
        run: |
          set -euo pipefail
          echo "path=$(ls LrGeniusAI-windows-x64-*.exe)" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned installer for signing
        if: matrix.os_name == 'windows'
        id: upload-unsigned-installer
        uses: actions/upload-artifact@v6
        with:
          name: unsigned-installer-${{ matrix.arch }}
          path: ${{ steps.locate-installer.outputs.path }}
          retention-days: 1

      - name: Submit installer to SignPath
        if: matrix.os_name == 'windows'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: deae5ebd-e056-4961-9aed-a3a047da535d
          project-slug: LrGeniusAI
          signing-policy-slug: test-signing
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installer

      - name: Replace installer with SignPath-signed version
        if: matrix.os_name == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          cp "signed-installer/$(basename "${{ steps.locate-installer.outputs.path }}")" "${{ steps.locate-installer.outputs.path }}"

      - name: Smoke test packaged backend and log cold start
        shell: bash
        run: |
          set -euo pipefail
          DB_DIR="$RUNNER_TEMP/lrgenius-smoke-db"
          DB_PATH="$DB_DIR/lrgenius.db"
          LOG_PATH="$DB_DIR/lrgenius-server.log"
          SMOKE_STDOUT="$DB_DIR/smoke-backend.out"
          mkdir -p "$DB_DIR"
          URL="http://127.0.0.1:19819/ping"
          START_TS=$(python3 -c "import time; print(time.time())")

          BIN="$GITHUB_WORKSPACE/build/lrgenius-server/lrgenius-server${{ matrix.bin_ext }}"
          if [ "${{ matrix.os_name }}" != "windows" ]; then
            chmod +x "$BIN"
          fi
          "$BIN" --db-path "$DB_PATH" >"$SMOKE_STDOUT" 2>&1 &
          BACKEND_PID=$!

          READY=0
          for i in $(seq 1 600); do
            if curl -sf "$URL" | grep -q "pong"; then
              READY=1
              break
            fi
            if ! kill -0 "$BACKEND_PID" 2>/dev/null; then
              echo "Backend process exited early before /ping became ready."
              break
            fi
            if [ $((i % 120)) -eq 0 ]; then
              echo "Still waiting for backend readiness... (${i}/600)"
            fi
            sleep 0.5
          done

          if [ "$READY" -ne 1 ]; then
            echo "Backend smoke test failed: /ping did not return pong in time."
            if [ -f "$LOG_PATH" ]; then
              echo "---- backend log tail ----"
              tail -n 120 "$LOG_PATH" || true
              echo "--------------------------"
            fi
            if [ -f "$SMOKE_STDOUT" ]; then
              echo "---- launcher stdout/stderr ----"
              tail -n 120 "$SMOKE_STDOUT" || true
              echo "--------------------------------"
            fi
            exit 1
          fi

          END_TS=$(python3 -c "import time; print(time.time())")
          COLD_START_SECONDS=$(python3 -c "import sys; print(f'{float(sys.argv[2]) - float(sys.argv[1]):.2f}')" "$START_TS" "$END_TS")
          echo "Measured cold start to /ping: ${COLD_START_SECONDS}s"

          curl -sf -X POST "http://127.0.0.1:19819/shutdown" || true

      - name: Pack artifact payload
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_DIR="artifact-payload"
          ARTIFACT_TAR="lrgenius-ai-${{ matrix.os_name }}-${{ matrix.arch }}.tar"
          mkdir -p "$ARTIFACT_DIR"
          tar -C build -cf "$ARTIFACT_DIR/$ARTIFACT_TAR" .

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: lrgenius-ai-${{ matrix.os_name }}-${{ matrix.arch }}
          path: |
            artifact-payload/lrgenius-ai-${{ matrix.os_name }}-${{ matrix.arch }}.tar
            *.pkg
            *.exe
          retention-days: 1
          compression-level: 9

  build-plugin-only:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [validate-tag]
    runs-on: ubuntu-latest
    name: Build Plugin Only

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update Info.lua with version and build date
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "$VERSION" == v[0-9]* ]]; then
            VERSION="${VERSION#v}"
          else
            VERSION="0.0.0-dev"
          fi
          # Info.lua's MAJOR/MINOR/REVISION are plain Lua number literals, so
          # drop any prerelease suffix (e.g. "3.0.0-pre3" -> "3.0.0") before
          # splitting — they may only contain numbers.
          VERSION_NUMERIC="${VERSION%%-*}"
          MAJOR=$(echo "$VERSION_NUMERIC" | cut -d. -f1)
          MINOR=$(echo "$VERSION_NUMERIC" | cut -d. -f2)
          REVISION=$(echo "$VERSION_NUMERIC" | cut -d. -f3)
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          REVISION=${REVISION:-0}
          BUILD_DATE=$(date +%Y%m%d)
          INFO_LUA="plugin/LrGeniusAI.lrdevplugin/Info.lua"
          sed 's/Info.MAJOR = .*/Info.MAJOR = '"$MAJOR"'/' "$INFO_LUA" > "$INFO_LUA.tmp" && mv "$INFO_LUA.tmp" "$INFO_LUA"
          sed 's/Info.MINOR = .*/Info.MINOR = '"$MINOR"'/' "$INFO_LUA" > "$INFO_LUA.tmp" && mv "$INFO_LUA.tmp" "$INFO_LUA"
          sed 's/Info.REVISION = .*/Info.REVISION = '"$REVISION"'/' "$INFO_LUA" > "$INFO_LUA.tmp" && mv "$INFO_LUA.tmp" "$INFO_LUA"
          sed 's/Info.BUILD = [0-9]*/build = '"$BUILD_DATE"'/' "$INFO_LUA" > "$INFO_LUA.tmp" && mv "$INFO_LUA.tmp" "$INFO_LUA"
          echo "Updated Info.lua: MAJOR=$MAJOR MINOR=$MINOR REVISION=$REVISION build=$BUILD_DATE"

      - name: Prepare plugin-only files
        shell: bash
        run: |
          BUILD_DIR="build-plugin-only"
          mkdir -p "$BUILD_DIR"
          cp -r plugin/LrGeniusAI.lrdevplugin "$BUILD_DIR/"

      - name: Pack plugin-only artifact payload
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_DIR="artifact-payload"
          ARTIFACT_TAR="lrgenius-ai-plugin-docker-backend.tar"
          mkdir -p "$ARTIFACT_DIR"
          tar -C build-plugin-only -cf "$ARTIFACT_DIR/$ARTIFACT_TAR" .

      - name: Upload plugin-only artifact
        uses: actions/upload-artifact@v6
        with:
          name: lrgenius-ai-plugin-docker-backend
          path: artifact-payload/lrgenius-ai-plugin-docker-backend.tar
          retention-days: 1

  build-docker-images:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: x64
            docker_platform: linux/amd64
          - arch: aarch64
            docker_platform: linux/arm64

    name: Build Docker Image - ${{ matrix.arch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve backend version build-args from tag
        id: backend-version
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          BUILD_DATE=$(date +%Y%m%d)
          {
            echo "version=${VERSION}"
            echo "release_tag=v${VERSION}"
            echo "build=${BUILD_DATE}"
          } >> "$GITHUB_OUTPUT"
          echo "Backend version build-args: version=${VERSION} build=${BUILD_DATE}"

      - name: Prepare image name
        id: image-name
        shell: bash
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "registry_image=ghcr.io/${OWNER_LC}/lrgeniusai" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./server-rs
          file: ./server-rs/Dockerfile
          platforms: ${{ matrix.docker_platform }}
          push: true
          build-args: |
            LRG_BACKEND_VERSION=${{ steps.backend-version.outputs.version }}
            LRG_BACKEND_RELEASE_TAG=${{ steps.backend-version.outputs.release_tag }}
            LRG_BACKEND_BUILD=${{ steps.backend-version.outputs.build }}
          tags: ${{ steps.image-name.outputs.registry_image }}:${{ github.ref_name }}-${{ matrix.arch }}
          cache-from: type=gha,scope=lrgeniusai-server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=lrgeniusai-server-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: false
          sbom: false
          # generate-summary: false

  # Combine per-arch pushes into one multi-arch :latest so `docker compose pull` works
  # with ghcr.io/.../lrgeniusai:latest (amd64 and arm64 clients resolve correctly).
  publish-docker-manifest:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-docker-images, create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    name: Publish Docker latest manifest

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push multi-arch latest
        shell: bash
        run: |
          set -euo pipefail
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMG="ghcr.io/${OWNER_LC}/lrgeniusai"
          TAG="${{ github.ref_name }}"
          docker buildx imagetools create \
            --tag "${IMG}:latest" \
            "${IMG}:${TAG}-x64" \
            "${IMG}:${TAG}-aarch64"

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-release, build-plugin-only]
    runs-on: ubuntu-latest
    name: Create Release
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: lrgenius-ai-*
          path: artifacts

      - name: Zip artifacts
        run: |
          VERSION=${{ github.ref_name }}

          cd artifacts

          for ARTIFACT_DIR in lrgenius-ai-windows-x64 lrgenius-ai-macos-arm64 lrgenius-ai-plugin-docker-backend; do
            if [ -d "$ARTIFACT_DIR" ]; then
              TAR_PATH="$(echo "$ARTIFACT_DIR"/*.tar)"
              if [ -f "$TAR_PATH" ]; then
                tar -xf "$TAR_PATH" -C "$ARTIFACT_DIR"
                rm -f "$TAR_PATH"
              fi
            fi
          done

          # actions/download-artifact normalizes permissions, so restore the executable bit before zipping.
          if [ -d "lrgenius-ai-macos-arm64" ]; then
            chmod +x lrgenius-ai-macos-arm64/lrgenius-server/lrgenius-server || true
          fi

          if [ -d "lrgenius-ai-windows-x64" ]; then
            cd lrgenius-ai-windows-x64
            zip -r ../LrGeniusAI-windows-x64-${VERSION}.zip .
            cd ..
          fi

          if [ -d "lrgenius-ai-macos-arm64" ]; then
            cd lrgenius-ai-macos-arm64
            zip -r ../LrGeniusAI-macos-arm64-${VERSION}.zip .
            cd ..
          fi

          if [ -d "lrgenius-ai-plugin-docker-backend" ]; then
            cd lrgenius-ai-plugin-docker-backend
            zip -r ../LrGeniusAI-plugin-docker-backend-${VERSION}.zip .
            cd ..
          fi

          cd ..

      - name: Set release metadata
        id: release-meta
        run: |
          VERSION="${{ github.ref_name }}"
          echo "release_name=Release ${VERSION}" >> $GITHUB_OUTPUT

      # The self-updater swaps the raw binary in place — it must NOT run
      # the full installer (UAC prompts / GUI wizard / plugin re-copy).
      # These are published as their own release assets, distinct from
      # the .pkg/.exe installers used for fresh installs.
      - name: Stage raw binaries for self-update manifest
        run: |
          set -euo pipefail
          mkdir -p update-assets
          if [ -f artifacts/lrgenius-ai-macos-arm64/lrgenius-server/lrgenius-server ]; then
            cp artifacts/lrgenius-ai-macos-arm64/lrgenius-server/lrgenius-server update-assets/lrgenius-server-macos-arm64
            chmod +x update-assets/lrgenius-server-macos-arm64
          fi
          if [ -f artifacts/lrgenius-ai-windows-x64/lrgenius-server/lrgenius-server.exe ]; then
            cp artifacts/lrgenius-ai-windows-x64/lrgenius-server/lrgenius-server.exe update-assets/lrgenius-server-windows-x64.exe
          fi
          echo "=== Staged self-update binaries ==="
          ls -la update-assets/

      - name: Generate update manifest
        run: |
          VERSION="${{ github.ref_name }}"
          BREAKING_FLAG=""
          if [[ "${{ github.event.inputs.breaking_changes }}" == "true" ]]; then
            BREAKING_FLAG="--breaking"
          fi
          BINARY_ARGS=()
          [ -f update-assets/lrgenius-server-macos-arm64 ] && BINARY_ARGS+=(--binary "macos-arm64=update-assets/lrgenius-server-macos-arm64")
          [ -f update-assets/lrgenius-server-windows-x64.exe ] && BINARY_ARGS+=(--binary "windows-x64=update-assets/lrgenius-server-windows-x64.exe")
          python3 scripts/generate_update_manifest.py \
            --version "${VERSION}" \
            --repo "${{ github.repository }}" \
            --output "update-manifest-${VERSION}.json" \
            "${BINARY_ARGS[@]}" \
            ${BREAKING_FLAG}
          echo "Generated update-manifest-${VERSION}.json"
          cat "update-manifest-${VERSION}.json" | python3 -c "import sys,json; m=json.load(sys.stdin); print(f'Manifest: {len(m[\"platforms\"])} platform binaries, {len(m[\"plugin_files\"])} plugin files, breaking={m[\"breaking_changes\"]}')"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.release-meta.outputs.release_name }}
          files: |
            artifacts/LrGeniusAI-plugin-docker-backend-${{ github.ref_name }}.zip
            artifacts/lrgenius-ai-macos-arm64/*.pkg
            artifacts/lrgenius-ai-windows-x64/*.exe
            update-assets/*
            update-manifest-${{ github.ref_name }}.json
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
