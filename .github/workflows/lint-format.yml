name: "Lint/format check"
on: [push, pull_request]
jobs:
  format-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Formatting (Lua)
        uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check plugin/LrGeniusAI.lrdevplugin plugin/spec
      - name: Linting (Lua)
        uses: lunarmodules/luacheck@cc089e3f65acdd1ef8716cc73a3eca24a6b845e4 # v1.2.0
        with:
          args: plugin/LrGeniusAI.lrdevplugin

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The staleness heuristic compares commit dates of pages against
          # their sources, so it needs the history, not just the tip.
          fetch-depth: 0
      - name: Docs match the code
        run: |
          set -o pipefail
          python3 scripts/check-docs.py 2>&1 | tee /tmp/check-docs.txt
        continue-on-error: false
      - name: Report possibly-stale pages
        if: always()
        run: |
          {
            echo "### Docs check"
            echo
            if grep -q . /tmp/check-docs.txt 2>/dev/null; then
              echo '```'
              cat /tmp/check-docs.txt
              echo '```'
            else
              echo "No findings."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  format-lint-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server-rs
      - name: Formatting (Rust)
        working-directory: server-rs
        run: cargo fmt --all -- --check
      - name: Linting (Rust)
        working-directory: server-rs
        run: cargo clippy --workspace --all-targets -- -D warnings
