name: Publish Wiki

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "README.md"
      - "plugin/README.md"
      - "server-rs/README.md"
      - "scripts/build-wiki-pages.sh"
      - "scripts/publish-wiki.sh"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:

# scripts/publish-wiki.sh clones the wiki and pushes to its master. Two doc
# merges inside this job's runtime make the second push a non-fast-forward, and
# the loss is asymmetric: if the run that fails carries the newer commit, those
# docs reach neither the wiki nor the website rebuild until some later docs push
# happens to carry them along. Serialised rather than cancelled so the newest
# docs always get their run.
concurrency:
  group: publish-wiki
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    env:
      WEBSITE_REBUILD_TOKEN: ${{ secrets.WEBSITE_REBUILD_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure scripts are executable
        run: chmod +x scripts/publish-wiki.sh scripts/build-wiki-pages.sh

      - name: Publish docs to GitHub Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/publish-wiki.sh

      - name: Trigger website rebuild
        # Requires WEBSITE_REBUILD_TOKEN secret with repo:workflow scope on LrGenius/lrgenius.github.io
        if: ${{ env.WEBSITE_REBUILD_TOKEN != '' }}
        run: |
          HTTP_CODE=$(curl -s -o /tmp/dispatch_response.txt -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${WEBSITE_REBUILD_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/LrGenius/lrgenius.github.io/dispatches \
            -d '{"event_type":"docs-updated"}')
          echo "HTTP ${HTTP_CODE}"
          cat /tmp/dispatch_response.txt
          [[ "${HTTP_CODE}" == "204" ]] || exit 1
