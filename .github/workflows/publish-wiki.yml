name: Publish Wiki

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "README.md"
      - "plugin/README.md"
      - "server/README.md"
      - "scripts/build-wiki-pages.sh"
      - "scripts/publish-wiki.sh"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure scripts are executable
        run: chmod +x scripts/publish-wiki.sh scripts/build-wiki-pages.sh

      - name: Publish docs to GitHub Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/publish-wiki.sh

      - name: Trigger website rebuild
        # Requires WEBSITE_REBUILD_TOKEN secret with repo:workflow scope on LrGenius/lrgenius.github.io
        if: ${{ secrets.WEBSITE_REBUILD_TOKEN != '' }}
        env:
          TOKEN: ${{ secrets.WEBSITE_REBUILD_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/LrGenius/lrgenius.github.io/dispatches \
            -d '{"event_type":"docs-updated"}'
