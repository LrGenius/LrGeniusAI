name: "Lua tests"
on:
  pull_request:
    paths:
      - "plugin/**"
      - ".busted"
      - ".github/workflows/lua-tests.yml"
  push:
    branches: [main]
    paths:
      - "plugin/**"
      - ".busted"
      - ".github/workflows/lua-tests.yml"
# Only ever reads the checkout; nothing here writes back to the repository.
permissions:
  contents: read

jobs:
  busted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Lua 5.1 (matches the Lightroom runtime)
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        with:
          luaVersion: "5.1"
      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6.1.0
      - name: Install busted
        run: luarocks install busted
      - name: Run headless unit tests
        run: busted
