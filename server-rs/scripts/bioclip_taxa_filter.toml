# Which of TreeOfLife-200M's 867,455 taxa ship in the zero-shot head.
#
# WHY PRUNE AT ALL: the full BioCLIP 2 text-embedding matrix is 2.66 GB fp32
# (1.33 GB fp16) — larger than the model itself, and it has to be resident in
# RAM for every classification. A Lightroom plugin cannot ask for that. The
# rules below cut it to roughly a tenth while keeping the taxa a photographer
# actually points a camera at.
#
# WHAT PRUNING COSTS: `classify` aggregates probabilities by taxonomic prefix,
# so every rank's confidence is a sum over *kept* rows only. Dropping a clade
# does not make the model say "I don't know" about it — it redistributes that
# clade's probability mass onto whatever similar-looking rows survived. That
# is why `keep_one_per_genus` exists (see below) and why
# `export_bioclip2_fp16.py --verify-only` compares top-1 predictions against
# the *full* torch head rather than just checking the ONNX graph.

[filter]
# Only these classes are considered at all. Everything outside (bacteria,
# protists, the long tail of marine invertebrates, most fungi) is dropped
# wholesale: it is not photographable with a camera in the field, or not
# identifiable from a photo even by a specialist.
class_whitelist = [
  # Vertebrates
  "Aves",
  "Mammalia",
  "Amphibia",
  "Reptilia",
  "Squamata",
  "Testudines",
  "Crocodylia",
  "Actinopterygii",
  "Chondrichthyes",
  # Arthropods
  "Insecta",
  "Arachnida",
  "Malacostraca",
  # Molluscs
  "Gastropoda",
  "Bivalvia",
  "Cephalopoda",
  # Plants
  "Magnoliopsida",
  "Liliopsida",
  "Pinopsida",
  "Polypodiopsida",
  "Lycopodiopsida",
  "Bryopsida",
  # Fungi + lichens
  "Agaricomycetes",
  "Lecanoromycetes",
  "Pezizomycetes",
]

# Within the whitelist, keep rows that have a non-empty common name.
#
# The common names in txt_emb_bioclip-2.json come from GBIF's
# VernacularName.tsv. A taxon having a vernacular name is a strong,
# already-present-in-the-data proxy for "humans encounter this often enough to
# have named it" — which is very nearly the definition of what ends up in a
# photo library. It costs no extra download to use.
require_common_name = true

# Keep at least one species per genus even when it has no common name.
#
# Without this the genus/family/order aggregation is biased: a genus whose
# species all lack vernacular names would vanish entirely, and its probability
# mass would land on a neighbouring genus instead of on the correct higher
# rank. With it, every genus in the whitelist stays representable, so a
# confident "Bombus (genus)" is still reachable even when the exact species is
# not in the head.
keep_one_per_genus = true

# Hard ceiling; the export fails rather than silently shipping something huge.
#
# Two different costs scale with this number, and the RAM one is the binding
# constraint: the head ships as fp16 (N x 768 x 2 bytes) but `lrg-ml::bioclip`
# dequantizes it to f32 at load time, so resident memory is N x 3 KB while the
# model is loaded. At 100k rows that is 154 MB on disk and 307 MB resident,
# sitting next to a ~600 MB ViT-L/14 session. 150k is the point where the head
# starts to dominate the model.
max_rows = 150000
