[project]
name = "lrg-model-export"
version = "0.1.0"
description = "Standalone Python env for exporting/verifying ONNX model assets consumed by the Rust backend (server-rs/lrg-ml). Not part of any shipped backend."
requires-python = ">=3.12.0"
dependencies = [
    "huggingface-hub>=1.12.0",
    "numpy>=2.4.4",
    "onnxruntime>=1.25.0",
    "open-clip-torch>=3.3.0",
    "pillow>=12.2.0",
    "timm>=1.0.26",
    "tokenizers>=0.22.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=5.14.1",
]

# This is a CPU-only export/verify script (see export_siglip2_fp16.py's
# module docstring) — no GPU is ever used here. On Linux, PyPI's default
# torch wheel bundles the full CUDA stack (cudnn/cublas/nvJitLink/...)
# regardless, and loading that CUDA-enabled torch build in the same
# process as onnxruntime (both export and verify run together, see
# main()) segfaults on CUDA-less CI runners — the two libraries'
# bundled CUDA/driver-stub init code conflicts with no GPU present to
# actually own it. Pinning to PyTorch's official CPU-only wheel index
# avoids pulling any CUDA libs on Linux in the first place. macOS has
# no CUDA wheels to begin with, so it's left on the default index.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
