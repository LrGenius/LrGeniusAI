[workspace]
resolver = "2"
members = [
    "crates/lrg-common",
    "crates/lrg-store",
    "crates/lrg-chroma-reader",
    "crates/lrg-imaging",
    "crates/lrg-ml",
    "crates/lrg-analysis",
    "crates/lrg-providers",
    "crates/lrg-llama",
    "crates/lrg-mlx",
    "crates/lrg-api",
    "crates/lrg-mcp",
    "crates/lrg-chat",
    "crates/lrg-server",
    "crates/lrg-develop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
lrg-common = { path = "crates/lrg-common" }
lrg-store = { path = "crates/lrg-store" }
lrg-chroma-reader = { path = "crates/lrg-chroma-reader" }
lrg-imaging = { path = "crates/lrg-imaging" }
lrg-ml = { path = "crates/lrg-ml" }
lrg-analysis = { path = "crates/lrg-analysis" }
lrg-providers = { path = "crates/lrg-providers" }
lrg-llama = { path = "crates/lrg-llama" }
lrg-mlx = { path = "crates/lrg-mlx" }
lrg-api = { path = "crates/lrg-api" }
lrg-develop = { path = "crates/lrg-develop" }
lrg-mcp = { path = "crates/lrg-mcp" }
lrg-chat = { path = "crates/lrg-chat" }

axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync", "fs"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
regex = "1"
uuid = { version = "1", features = ["v4"] }

# dev/test
http-body-util = "0.1"
tempfile = "3"

[profile.release]
lto = "thin"
strip = "symbols"

# What the release workflow runs the test suite under. Same optimisation as
# `release` (the ML tests are too slow unoptimised), but without LTO: with
# `lto = "thin"` every test binary and example repeats an LTO pass over the
# whole dependency graph, and the Windows leg ran past its 240 minute limit
# in that link phase alone.
[profile.release-test]
inherits = "release"
lto = false
strip = "none"
