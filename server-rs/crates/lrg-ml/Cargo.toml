[package]
name = "lrg-ml"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lrg-imaging.workspace = true
ort = { version = "2.0.0-rc.13", features = ["coreml"] }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
ndarray = "0.16"
