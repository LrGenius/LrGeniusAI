[package]
name = "lrg-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "geniusai-server"
path = "src/main.rs"

[features]
# Pass-through so `cargo build -p lrg-server --features llamacpp` is all the
# release workflow needs.
llamacpp = ["lrg-api/llamacpp"]

[dependencies]
lrg-api.workspace = true
lrg-common.workspace = true
lrg-store.workspace = true
lrg-chroma-reader.workspace = true
serde_json.workspace = true

axum.workspace = true
clap.workspace = true
log.workspace = true
tokio.workspace = true
