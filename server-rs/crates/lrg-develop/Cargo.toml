[package]
name = "lrg-develop"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Enables `xmp::WriteMode::TestRoundTrip` and `lua::LuaMode::TestRoundTrip`,
# which write opaque, COMPUTED, NEVER and UNKNOWN content verbatim. Tests
# only: it is switched on solely by the self dev-dependency below, so no
# production build (`cargo build -p lrg-server`) has it. Never enable it from
# another crate, and never name `WriteMode::TestRoundTrip` or
# `LuaMode::TestRoundTrip` outside lrg-develop: any build that compiles
# lrg-develop's tests (`cargo test --workspace`, `cargo clippy --workspace
# --all-targets`) unifies the feature into the lrg-develop every crate links,
# so CI cannot catch such a use; only the release build would fail.
test-roundtrip = []

[dependencies]
roxmltree = "0.21.1"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
lrg-develop = { path = ".", features = ["test-roundtrip"] }
regex.workspace = true
