<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Search — LrGeniusAI</title>
    <style>
      :root {
        --bg: #1e1e1e;
        --panel: #2b2b2b;
        --panel-hi: #333;
        --line: #3d3d3d;
        --text: #d8d8d8;
        --dim: #8f8f8f;
        --accent: #4a90d9;
        --warn: #c9962f;
        --error: #d05252;
        --ok: #5fa85f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        padding: 10px 16px;
      }
      .bar + .bar { padding-top: 0; color: var(--dim); }
      h1 { font-size: 15px; font-weight: 600; margin: 0 8px 0 0; }
      button {
        font: inherit;
        color: var(--text);
        background: var(--panel-hi);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 5px 11px;
        cursor: pointer;
      }
      button:hover:not(:disabled) { background: #3c3c3c; }
      button:disabled { opacity: 0.45; cursor: default; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button.primary:hover:not(:disabled) { background: #5a9fe4; }
      input, select {
        font: inherit;
        color: var(--text);
        background: #232323;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 5px 7px;
      }
      input:focus, select:focus { outline: 1px solid var(--accent); }
      input[type="range"] { padding: 0; width: 120px; vertical-align: middle; }
      #term { flex: 1; min-width: 240px; font-size: 14px; }
      label.inline { display: inline-flex; align-items: center; gap: 6px; }
      .value { color: var(--text); min-width: 2.5em; display: inline-block; }
      .spacer { flex: 1; }
      .pill { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--error); }
      .dot.on { background: var(--ok); }

      #notices, #banners, #warnings { padding: 0 16px; }
      .banner {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        margin-top: 10px;
        padding: 9px 12px;
        border-radius: 4px;
        border-left: 3px solid var(--warn);
        background: #33302a;
      }
      .banner.error { border-left-color: var(--error); background: #382a2a; }
      .banner.info { border-left-color: var(--accent); background: #26303a; }
      .banner > div { flex: 1; }
      .banner button { padding: 0 6px; background: none; border: none; color: var(--dim); }

      #summary {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        padding: 12px 16px 0;
        color: var(--dim);
      }
      #summary b { color: var(--text); font-weight: 600; }

      main {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 12px;
        padding: 14px 16px 40px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 5px;
        overflow: hidden;
      }
      .thumb {
        position: relative;
        aspect-ratio: 1 / 1;
        background: #161616;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .thumb img { max-width: 100%; max-height: 100%; display: block; }
      .thumb .none { color: var(--dim); font-size: 12px; text-align: center; padding: 10px; }
      .rank {
        position: absolute;
        top: 6px;
        left: 6px;
        background: rgba(0, 0, 0, 0.65);
        border-radius: 3px;
        padding: 0 6px;
        font-size: 11px;
      }
      .meta { padding: 6px 8px; font-size: 12px; color: var(--dim); display: flex; gap: 8px; flex-wrap: wrap; }
      .meta .score { color: var(--text); }
      #empty { padding: 40px 16px; color: var(--dim); text-align: center; }
      #empty[hidden] { display: none; }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <h1>Search</h1>
        <input
          id="term"
          type="search"
          list="history"
          autocomplete="off"
          placeholder="Describe what you are looking for — or leave empty for the best photos"
        />
        <datalist id="history"></datalist>
        <button id="go" class="primary">Search</button>
        <select id="scope" title="Which photos to search">
          <option value="all">All indexed photos in this catalog</option>
          <option value="view">Current view</option>
          <option value="selection">Selected photos</option>
        </select>
        <button id="refresh-scope" title="Read the current view and selection from Lightroom again">
          Update from Lightroom
        </button>
        <span class="spacer"></span>
        <span class="pill"><span id="conn-dot" class="dot"></span><span id="conn-text">Lightroom: …</span></span>
      </div>
      <div class="bar">
        <label class="inline"
          >Sort
          <select id="sort">
            <option value="relevance">Relevance</option>
            <option value="aesthetic">Aesthetic score</option>
            <option value="combined">Relevance and aesthetic score</option>
          </select>
        </label>
        <label class="inline" title="Leave out photos scored below this"
          >Min. aesthetic
          <input id="min-aesthetic" type="range" min="0" max="18" step="1" value="0" />
          <span id="min-aesthetic-value" class="value">Off</span>
        </label>
        <label class="inline"
          >Genre
          <select id="genre"><option value="all">All genres</option></select>
        </label>
        <label class="inline" title="How sharply weak matches are cut off; 0 keeps everything up to the maximum"
          >Strictness
          <input id="strictness" type="range" min="0" max="100" step="5" value="50" />
          <span id="strictness-value" class="value">50</span>
        </label>
        <label class="inline"
          >Max results
          <input id="max-results" type="range" min="50" max="1000" step="50" value="300" />
          <span id="max-results-value" class="value">300</span>
        </label>
        <label class="inline" title="Also find the words in keywords, titles, captions and alt text"
          ><input id="metadata" type="checkbox" checked /> Keywords and captions</label
        >
      </div>
    </header>

    <div id="notices"></div>
    <div id="banners"></div>
    <div id="warnings"></div>

    <div id="summary">
      <span id="count"></span>
      <span class="spacer"></span>
      <span id="action-state"></span>
      <button id="show" class="primary" disabled>Show in Lightroom</button>
    </div>

    <main id="grid"></main>
    <div id="empty" hidden></div>

    <script>
      "use strict";

      // The plugin passes its catalog's db_path when it opens this page, and
      // every request carries it back, exactly as the People page does: a
      // backend that restarted underneath us re-binds instead of answering
      // about an empty catalog.
      const DB_PATH = new URLSearchParams(location.search).get("db_path") || "";

      // The backend's access token, from the address's #fragment (which the
      // browser sends nowhere), kept for this tab so a reload still works.
      const TOKEN = (() => {
        const fromAddress = new URLSearchParams(location.hash.slice(1)).get("token");
        if (fromAddress) {
          try {
            sessionStorage.setItem("lrgenius-token", fromAddress);
          } catch (e) {
            // No storage (private window): only a reload loses the token.
          }
          history.replaceState(null, "", location.pathname + location.search);
          return fromAddress;
        }
        try {
          return sessionStorage.getItem("lrgenius-token") || "";
        } catch (e) {
          return "";
        }
      })();

      function authHeaders(extra) {
        const headers = Object.assign({}, extra);
        if (TOKEN) headers["Authorization"] = "Bearer " + TOKEN;
        return headers;
      }

      // Every backend path this page calls, in one block.
      const API = {
        search: "/v1/search",
        genres: "/v1/search/genres",
        thumbnail: (id) => "/v1/photos/thumbnail?photo_id=" + encodeURIComponent(id),
        context: "/v1/ui/search/context",
        actions: "/v1/ui/actions",
        status: "/v1/ui/status?page=search",
      };

      const PAGE = "search";
      const HISTORY_KEY = "lrgenius-search-history";
      const HISTORY_LENGTH = 20;

      const el = (id) => document.getElementById(id);

      let context = null; // what the plugin posted: catalog, view, selection
      let contextRevision = 0;
      let results = []; // the last answer, in rank order
      let lastRequest = null; // the options that produced `results`
      let lastGenreLabel = null; // the genre filter of that search, as shown
      let searchSeq = 0;
      let pluginConnected = false;
      const thumbCache = new Map(); // photo_id -> object URL, or null for none

      function withDbPath(path) {
        if (!DB_PATH) return path;
        return path + (path.includes("?") ? "&" : "?") + "db_path=" + encodeURIComponent(DB_PATH);
      }

      // Returns the decoded body. Failures throw with a message the user can
      // act on; warnings are left in the body for the caller, which decides
      // where they belong (a search's replace the last search's).
      async function api(method, path, body, signal) {
        let response;
        try {
          response = await fetch(withDbPath(path), {
            method,
            headers: authHeaders(body ? { "Content-Type": "application/json" } : {}),
            body: body ? JSON.stringify(body) : undefined,
            signal,
          });
        } catch (e) {
          if (signal && signal.aborted) throw e;
          throw new Error(
            "Could not reach the LrGeniusAI backend. It may have stopped — close this page, then " +
              "open Search (browser) again in Lightroom to restart it. (" + e.message + ")"
          );
        }
        const text = await response.text();
        let data = {};
        if (text) {
          try {
            data = JSON.parse(text);
          } catch (e) {
            throw new Error("Backend returned a malformed response: " + text.slice(0, 300));
          }
        }
        if (data.error_code === "api_token") {
          throw new Error(
            "The backend did not accept this page: it has no access token, or an old one. " +
              "Close this page and open Search (browser) again from Lightroom."
          );
        }
        if (!response.ok || data.error) {
          throw new Error(data.error || "Backend returned HTTP " + response.status);
        }
        return data;
      }

      function banner(message, kind, where) {
        const host = el(where || "banners");
        for (const shown of host.querySelectorAll(".banner")) {
          if (shown.firstChild && shown.firstChild.textContent === message) return;
        }
        const box = document.createElement("div");
        // "info" fades after a few seconds; "note" is the same look and stays.
        box.className =
          "banner" + (kind === "error" ? " error" : kind === "info" || kind === "note" ? " info" : "");
        const text = document.createElement("div");
        text.textContent = message;
        const close = document.createElement("button");
        close.textContent = "✕";
        close.title = "Dismiss";
        close.onclick = () => box.remove();
        box.append(text, close);
        host.append(box);
        if (kind === "info") setTimeout(() => box.remove(), 6000);
      }

      // ---- History ------------------------------------------------------

      function loadHistory() {
        let list = [];
        try {
          list = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
        } catch (e) {
          list = [];
        }
        // The plugin's own history (the Advanced Search dialog's) comes after
        // the page's, so both dialogs' searches are one keystroke away.
        const fromPlugin = (context && Array.isArray(context.history) && context.history) || [];
        const seen = new Set();
        return list
          .concat(fromPlugin)
          .filter((t) => typeof t === "string" && t.trim() && !seen.has(t) && seen.add(t))
          .slice(0, HISTORY_LENGTH);
      }

      function pushHistory(term) {
        term = (term || "").trim();
        if (!term) return;
        const list = [term].concat(loadHistory().filter((t) => t !== term)).slice(0, HISTORY_LENGTH);
        try {
          localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
        } catch (e) {
          // No storage: the history lasts as long as the page.
        }
        renderHistory(list);
      }

      function renderHistory(list) {
        const host = el("history");
        host.replaceChildren(
          ...(list || loadHistory()).map((t) => {
            const option = document.createElement("option");
            option.value = t;
            return option;
          })
        );
      }

      // ---- Context (Lightroom's view and selection) ---------------------

      function scopeIds(scope) {
        const scopes = (context && context.scopes) || {};
        const entry = scopes[scope];
        return entry && Array.isArray(entry.photo_ids) ? entry.photo_ids : [];
      }

      function scopeInfo(name) {
        const entry = ((context && context.scopes) || {})[name] || {};
        return { ids: scopeIds(name), label: entry.label, wholeCatalog: entry.whole_catalog === true, count: entry.count };
      }

      // "Current view" when Lightroom shows All Photographs: the plugin sends
      // no IDs for it, since it is the same search as "All indexed photos".
      function scopeIsWholeCatalog(scope) {
        return scope === "all" || (scope === "view" && scopeInfo("view").wholeCatalog);
      }

      function renderScopes() {
        const select = el("scope");
        const view = scopeInfo("view");
        const selection = scopeInfo("selection");
        for (const option of select.options) {
          if (option.value === "view") {
            const size = view.wholeCatalog ? (typeof view.count === "number" ? view.count : "all") : view.ids.length;
            option.textContent = "Current view" + (view.label ? " — " + view.label : "") + " (" + size + ")";
            option.disabled = !view.wholeCatalog && view.ids.length === 0;
          } else if (option.value === "selection") {
            option.textContent = "Selected photos (" + selection.ids.length + ")";
            option.disabled = selection.ids.length === 0;
          }
        }
        if (select.selectedOptions[0] && select.selectedOptions[0].disabled) select.value = "all";
        // Photos Lightroom showed whose ID could not be worked out are not in
        // the scope; say so instead of searching fewer photos quietly.
        const unresolved = (name) => (((context && context.scopes) || {})[name] || {}).unresolved || 0;
        for (const [name, label] of [
          ["view", "current view"],
          ["selection", "selection"],
        ]) {
          const n = unresolved(name);
          if (n > 0) {
            banner(
              n +
                " photo(s) of the " +
                label +
                " could not be identified (their files may be offline) and are not searched. " +
                "Reconnect the files in Lightroom, then click “Update from Lightroom”.",
              "warn"
            );
          }
        }
      }

      // What the plugin knows a search here cannot see (no search model,
      // photos never indexed), as the Advanced Search dialog says before it
      // opens — replaced, not added to, when the context is read again.
      function renderNotices() {
        const host = el("notices");
        host.replaceChildren();
        const notices = (context && Array.isArray(context.notices) && context.notices) || [];
        notices.filter((n) => typeof n === "string" && n).forEach((n) => banner(n, "warn", "notices"));
        if (context && !context.catalog_id) {
          banner(
            "LrGeniusAI could not tell which catalog this is, so a search is not limited to it and can " +
              "find photos of other catalogs that use the same backend. “Show in Lightroom” leaves those out.",
            "warn",
            "notices"
          );
        }
      }

      async function loadContext(waitForRevisionAbove, timeoutMs) {
        const deadline = Date.now() + (timeoutMs || 15000);
        for (;;) {
          let data;
          try {
            data = await api("GET", API.context);
          } catch (e) {
            banner(e.message, "error");
            return false;
          }
          const fresh = data.context && data.revision > (waitForRevisionAbove || 0);
          if (fresh) {
            context = data.context;
            contextRevision = data.revision;
            renderScopes();
            renderNotices();
            renderHistory();
            return true;
          }
          if (Date.now() > deadline) return false;
          await new Promise((resolve) => setTimeout(resolve, 700));
        }
      }

      async function refreshScopes() {
        const button = el("refresh-scope");
        button.disabled = true;
        const label = button.textContent;
        button.textContent = "Reading from Lightroom…";
        try {
          const data = await api("POST", API.actions, { page: PAGE, action: "refresh_search_context" });
          if (!data.plugin_connected) {
            banner(notListening(), "error");
            return;
          }
          // A large folder takes Lightroom a while to list.
          if (await loadContext(contextRevision, 90000)) {
            banner("Updated the current view and selection from Lightroom.", "info");
            if (el("scope").value !== "all") scheduleSearch(0);
          } else {
            banner(
              "Lightroom did not answer in time. If its progress bar still says it is reading the view, " +
                "wait for it and click “Update from Lightroom” again.",
              "warn"
            );
          }
        } catch (e) {
          banner("Could not ask Lightroom for the current view: " + e.message, "error");
        } finally {
          button.textContent = label;
          button.disabled = false;
        }
      }

      // ---- Search -------------------------------------------------------

      function minAesthetic() {
        // Half points on the 1–9 scale; 0 and 1 are "off", like the
        // Advanced Search dialog's slider (Util.minAestheticFromSlider).
        const position = Number(el("min-aesthetic").value);
        return position < 2 ? null : position / 2;
      }

      function selectedGenreLabel() {
        const select = el("genre");
        return select.value === "all" ? null : select.selectedOptions[0].textContent;
      }

      // Mirrors Util.searchRankingOptions in the plug-in: without a term the
      // order is the aesthetic score whatever the popup says.
      function requestBody() {
        const term = el("term").value.trim();
        const hasTerm = term !== "";
        let sort = el("sort").value;
        if (!hasTerm) sort = "aesthetic";
        const body = {
          term: hasTerm ? term : undefined,
          catalog_id: context && context.catalog_id ? context.catalog_id : undefined,
          relevance_strictness: Number(el("strictness").value),
          max_results: Number(el("max-results").value),
          sort,
          search_sources: {
            semantic_siglip: true,
            metadata: el("metadata").checked,
            metadata_fields: ["flattened_keywords", "alt_text", "caption", "title"],
          },
        };
        const min = minAesthetic();
        if (min !== null) body.min_aesthetic = min;
        if (el("genre").value !== "all") body.genres = [el("genre").value];
        if (sort === "combined") body.aesthetic_weight = 0.5;
        const scope = el("scope").value;
        if (!scopeIsWholeCatalog(scope)) body.photo_ids = scopeIds(scope);
        return body;
      }

      let searchTimer = null;
      function scheduleSearch(delay) {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(runSearch, delay);
      }

      // The search still running, cancelled when a newer one starts: a
      // dragged slider should not leave the backend working through every
      // position it passed.
      let inFlight = null;

      async function runSearch() {
        const body = requestBody();
        const genreLabel = selectedGenreLabel();
        const scope = el("scope").value;
        const seq = ++searchSeq;
        if (inFlight) inFlight.abort();
        inFlight = null;
        if (!scopeIsWholeCatalog(scope) && body.photo_ids.length === 0) {
          showEmpty("The " + (scope === "view" ? "current view" : "selection") + " is empty in Lightroom.");
          return;
        }
        el("sort").disabled = !body.term;
        el("count").textContent = body.term ? "Searching…" : "Ranking by aesthetic score…";
        const controller = new AbortController();
        inFlight = controller;
        let data;
        try {
          data = await api("POST", API.search, body, controller.signal);
        } catch (e) {
          if (seq !== searchSeq || controller.signal.aborted) return;
          el("count").textContent = "";
          el("warnings").replaceChildren();
          banner("The search failed: " + e.message, "error", "warnings");
          return;
        }
        // A slider dragged on: only the newest answer is drawn.
        if (seq !== searchSeq) return;
        inFlight = null;
        results = Array.isArray(data.results) ? data.results : [];
        lastRequest = body;
        lastGenreLabel = genreLabel;
        el("warnings").replaceChildren();
        const warnings = Array.isArray(data.warnings) ? data.warnings : data.warning ? [data.warning] : [];
        warnings.forEach((w) => banner(w, "warn", "warnings"));
        render();
      }

      function showEmpty(message) {
        results = [];
        lastRequest = null;
        el("grid").replaceChildren();
        el("empty").textContent = message;
        el("empty").hidden = false;
        el("count").textContent = "";
        el("show").disabled = true;
      }

      // ---- Results ------------------------------------------------------

      const observer = new IntersectionObserver(
        (entries) => {
          for (const entry of entries) {
            if (!entry.isIntersecting) continue;
            observer.unobserve(entry.target);
            loadThumbnail(entry.target);
          }
        },
        { rootMargin: "400px" }
      );

      // Previews are fetched with the access token rather than through
      // <img src>, which cannot carry it — they are pictures from the
      // catalog and stay behind the token like any other data.
      async function loadThumbnail(box) {
        const id = box.dataset.photoId;
        if (!thumbCache.has(id)) {
          let url = null;
          try {
            const response = await fetch(withDbPath(API.thumbnail(id)), { headers: authHeaders() });
            if (response.ok) url = URL.createObjectURL(await response.blob());
          } catch (e) {
            url = null;
          }
          thumbCache.set(id, url);
        }
        const url = thumbCache.get(id);
        if (url) {
          const img = document.createElement("img");
          img.src = url;
          img.alt = "";
          box.replaceChildren(img, box.querySelector(".rank"));
        } else {
          setPlaceholder(box, "No preview");
        }
      }

      function setPlaceholder(box, text) {
        const none = document.createElement("div");
        none.className = "none";
        none.textContent = text;
        box.replaceChildren(none, box.querySelector(".rank"));
      }

      function card(result, index) {
        const item = document.createElement("div");
        item.className = "card";
        const box = document.createElement("div");
        box.className = "thumb";
        box.dataset.photoId = result.photo_id;
        const rank = document.createElement("span");
        rank.className = "rank";
        rank.textContent = "#" + (index + 1);
        box.append(rank);
        if (result.has_thumbnail === false) {
          setPlaceholder(box, "No preview yet");
        } else {
          setPlaceholder(box, "…");
          observer.observe(box);
        }
        const meta = document.createElement("div");
        meta.className = "meta";
        if (typeof result.aesthetic_score === "number") {
          const score = document.createElement("span");
          score.className = "score";
          score.textContent = "★ " + result.aesthetic_score.toFixed(1);
          score.title = "Aesthetic score";
          meta.append(score);
        }
        if (result.genre_label) {
          const genre = document.createElement("span");
          genre.textContent = result.genre_label;
          meta.append(genre);
        }
        // A semantic hit is placed by its rank; the raw distance means little
        // to anyone (SigLIP similarities sit in a narrow band). A hit found
        // only by its words says so, since its rank is not a similarity.
        if (typeof result.distance !== "number" && lastRequest && lastRequest.term) {
          const text = document.createElement("span");
          text.textContent = "word match";
          text.title = "Found in the keywords, title or caption";
          meta.append(text);
        }
        item.append(box, meta);
        return item;
      }

      function render() {
        const grid = el("grid");
        observer.disconnect();
        grid.replaceChildren(...results.map(card));
        el("show").disabled = results.length === 0;
        if (results.length === 0) {
          el("empty").textContent = "No photos match. Lower the strictness or the minimum aesthetic score, or search for something else.";
          el("empty").hidden = false;
          el("count").textContent = "";
          return;
        }
        el("empty").hidden = true;
        const missing = results.filter((r) => r.has_thumbnail === false).length;
        const count = el("count");
        count.replaceChildren();
        const total = document.createElement("b");
        total.textContent = results.length + (results.length === 1 ? " photo" : " photos");
        count.append(total);
        if (missing > 0) {
          count.append(" · " + missing + " without a preview");
          banner(
            missing +
              (missing === 1 ? " of these photos has" : " of these photos have") +
              " no preview yet: indexed before LrGeniusAI stored previews. To add them, click “Show in " +
              "Lightroom”, select the photos of the new collection and run Library ▸ Plug-in Extras ▸ " +
              "Analyze & Index Photos with the scope “Selected photos only” and “Skip photos with existing data”: " +
              "the previews are added, and nothing that is already there is made again. (“New or " +
              "unprocessed photos” does not pick them up.)",
            "note",
            "warnings"
          );
        }
      }

      // ---- Lightroom ----------------------------------------------------

      function notListening() {
        return (
          "Lightroom is not listening, so nothing will happen. The Search window was closed there — " +
          "reopen Library ▸ Plug-in Extras ▸ Search (browser)…, then try again."
        );
      }

      async function showInLightroom() {
        if (results.length === 0 || !lastRequest) return;
        if (lastRequest.term) pushHistory(lastRequest.term);
        const state = el("action-state");
        state.textContent = "Sending…";
        try {
          const data = await api("POST", API.actions, {
            page: PAGE,
            action: "show_search_results",
            photo_ids: results.map((r) => r.photo_id),
            term: lastRequest.term || "",
            sort: lastRequest.sort,
            min_aesthetic: lastRequest.min_aesthetic,
            genre_label: lastGenreLabel,
            max_results: lastRequest.max_results,
          });
          if (data.plugin_connected) {
            state.textContent = "Sent — switch to Lightroom.";
            setTimeout(() => {
              if (state.textContent.startsWith("Sent")) state.textContent = "";
            }, 6000);
          } else {
            state.textContent = "";
            banner(notListening(), "error");
          }
        } catch (e) {
          state.textContent = "";
          banner("Could not send the results to Lightroom: " + e.message, "error");
        }
      }

      async function heartbeat() {
        try {
          const response = await fetch(withDbPath(API.status), { headers: authHeaders() });
          const data = await response.json();
          pluginConnected = !!data.plugin_connected;
        } catch (e) {
          pluginConnected = false;
        }
        el("conn-dot").classList.toggle("on", pluginConnected);
        el("conn-text").textContent = pluginConnected ? "Lightroom: connected" : "Lightroom: not listening";
      }

      async function loadGenres() {
        try {
          const data = await api("GET", API.genres);
          const select = el("genre");
          for (const genre of data.genres || []) {
            const option = document.createElement("option");
            option.value = genre.id;
            option.textContent = genre.label || genre.id;
            select.append(option);
          }
        } catch (e) {
          // Searching works without it; only the filter is missing.
          el("genre").disabled = true;
          el("genre").title = "The genre list could not be loaded: " + e.message;
        }
      }

      function applyDefaults() {
        const d = (context && context.defaults) || {};
        const set = (id, value) => {
          if (value !== undefined && value !== null) el(id).value = value;
        };
        set("term", d.term);
        set("strictness", d.relevance_strictness);
        set("max-results", d.max_results);
        set("sort", d.sort);
        set("min-aesthetic", d.min_aesthetic_position);
        // Only a genre the backend still names; otherwise "All genres".
        if (d.genre && [...el("genre").options].some((o) => o.value === d.genre)) set("genre", d.genre);
        if (typeof d.metadata === "boolean") el("metadata").checked = d.metadata;
        if (d.scope && ["all", "view", "selection"].includes(d.scope)) set("scope", d.scope);
        renderScopes();
        updateLabels();
      }

      function updateLabels() {
        el("strictness-value").textContent = el("strictness").value;
        el("max-results-value").textContent = el("max-results").value;
        const min = minAesthetic();
        el("min-aesthetic-value").textContent = min === null ? "Off" : min.toFixed(1);
      }

      // ---- Wiring -------------------------------------------------------

      el("go").onclick = () => {
        pushHistory(el("term").value);
        scheduleSearch(0);
      };
      el("term").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          pushHistory(el("term").value);
          scheduleSearch(0);
        }
      });
      // Typing searches once the user pauses; every other control at once
      // (debounced, so a dragged slider sends one request, not fifty).
      el("term").addEventListener("input", () => scheduleSearch(900));
      for (const id of ["strictness", "max-results", "min-aesthetic"]) {
        el(id).addEventListener("input", () => {
          updateLabels();
          scheduleSearch(350);
        });
      }
      for (const id of ["sort", "genre", "scope", "metadata"]) {
        el(id).addEventListener("change", () => scheduleSearch(0));
      }
      el("refresh-scope").onclick = refreshScopes;
      el("show").onclick = showInLightroom;

      (async () => {
        heartbeat();
        setInterval(heartbeat, 5000);
        renderHistory();
        await loadGenres();
        if (!(await loadContext(0))) {
          banner(
            "Lightroom has not sent the current view and selection yet, so only “All indexed photos” " +
              "can be searched. Use “Update from Lightroom” once Search (browser) is running there.",
            "warn"
          );
        }
        applyDefaults();
        scheduleSearch(0);
      })();
    </script>
  </body>
</html>
