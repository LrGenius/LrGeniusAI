[package]
name = "lrg-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Compiles the in-process llama.cpp engine in. Off by default so that anyone
# building an unrelated crate does not need cmake + libclang (and, on Windows,
# a CUDA toolkit); the release workflow turns it on.
llamacpp = ["dep:lrg-llama"]

[dependencies]
lrg-llama = { workspace = true, optional = true }
# Not optional and not feature-gated: unlike lrg-llama this only spawns and
# talks to a process, so it adds no native toolchain requirement and no
# meaningful build time. Whether MLX actually works is a runtime question
# (Apple silicon + the sidecar binary), answered by `mlx_engine::availability`.
lrg-mlx.workspace = true
lrg-common.workspace = true
lrg-store.workspace = true
lrg-ml.workspace = true
lrg-analysis.workspace = true
lrg-imaging.workspace = true
lrg-providers.workspace = true

axum.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
async-trait = "0.1.91"

[dev-dependencies]
lrg-store.workspace = true
http-body-util.workspace = true
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
